# 测试专用覆盖：关闭内存限流。
#
# 注意：这里必须用 application.properties，不能用 application.yml ——
# 同名 application.yml 会覆盖（shadow）src/main/resources/application.yml，
# 导致测试环境丢掉数据源等全部主配置，上下文直接起不来。
# 不同扩展名则两者都会加载，properties 优先级更高，只覆盖这一项。
ratelimit.enabled=false

# 测试库与开发库隔离：mvn test 不污染 family_menu_daily_db。
# 测试 schema 由 sql 初始化自动建表（spring.sql.init 沿用主配置 schema.sql）。
spring.datasource.url=jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${TEST_DB_NAME:family_menu_daily_test_db}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
