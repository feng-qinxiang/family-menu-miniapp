server:
  port: ${SERVER_PORT:9088}
  # 部署在 nginx 之后：让 Spring 采信 X-Forwarded-* 头，否则限流/日志里全是代理 IP
  forward-headers-strategy: native
  tomcat:
    # 默认 200 线程远大于连接池（默认 10），请求会排队等连接；给一个保守上限
    threads:
      max: ${TOMCAT_MAX_THREADS:100}

spring:
  application:
    name: family-menu-daily-server
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:family_menu_daily_db}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: 10000
      max-lifetime: 1740000
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  sql:
    init:
      # 默认 always 便于本地开发与测试；生产必须设 SPRING_SQL_INIT_MODE=never，
      # 否则每次启动都会执行 schema.sql 并注入 data.sql 的演示数据（含免费年卡会员）。
      # 见 application-prod.yml。
      mode: ${SPRING_SQL_INIT_MODE:always}
      encoding: UTF-8
      continue-on-error: true

wechat:
  app-id: ${WECHAT_APP_ID:}
  app-secret: ${WECHAT_APP_SECRET:}
  subscribe:
    # 订阅消息模板 ID：先去小程序后台「订阅消息」申请模板，审核通过后把 ID 填在这里。
    # 留空 = 该事件不推送（前端也不会显示"消息通知"开关），配上即生效，不需要改代码。
    #
    # 申请模板时注意：本代码按「事项 + 说明」两个字段发送，
    # 所以要选字段为 thing1 / thing2 的模板（thing 类型单字段上限 20 个字符）。
    # 若后台给的字段名不同，改 SubscribeMessageService 里的 FIELD_SUBJECT / FIELD_DETAIL。
    template-wish: ${WECHAT_SUBSCRIBE_TEMPLATE_WISH:}   # 家人许愿（"XX 想吃糖醋排骨"）
    template-meal: ${WECHAT_SUBSCRIBE_TEMPLATE_MEAL:}   # 开饭提醒（"今天的菜都做好了"）
    # 消息里跳转的小程序版本：formal=正式版，trial=体验版，developer=开发版。
    # 上线后用 formal；只有体验版时可临时改 trial，否则用户点消息会跳不动。
    miniprogram-state: ${WECHAT_SUBSCRIBE_STATE:formal}
  pay:
    # 微信支付 v3 JSAPI 商户配置。任一关键项留空 → prepay 接口返回 mockMode:true 优雅降级，绝不崩溃。
    mch-id: ${WECHAT_MCH_ID:}                    # 商户号
    api-v3-key: ${WECHAT_PAY_API_V3_KEY:}        # APIv3 密钥（32 位，用于回调 AES-256-GCM 解密）
    cert-serial-no: ${WECHAT_PAY_CERT_SERIAL:}   # 商户证书序列号
    private-key-path: ${WECHAT_PAY_KEY_PATH:}    # 商户私钥 PEM 文件路径（apiclient_key.pem）
    # 微信支付平台证书 PEM（回调 RSA 验签用）。未配置则回调一律拒绝，防止伪造到账。
    platform-cert-path: ${WECHAT_PAY_PLATFORM_CERT_PATH:}
    notify-url: ${WECHAT_PAY_NOTIFY_URL:}        # 回调地址（公网 https）
    # 模拟支付开关：mock-pay 端点免真实付款直接开通会员（资损风险），
    # 生产必须保持 false，本地联调用 WECHAT_PAY_MOCK_ENABLED=true 显式开启。
    mock-pay-enabled: ${WECHAT_PAY_MOCK_ENABLED:false}

sms:
  # 短信网关供应商：noop=未接入（落库 + 日志告警），后续可接 aliyun/tencent。
  provider: ${SMS_PROVIDER:noop}

auth:
  # 安全默认关闭：开发态固定验证码(246810)与验证码明文回显仅供联调，
  # 生产/默认环境必须保持 false，避免任意手机号被未授权登录。本地联调用 AUTH_DEV_OTP_ENABLED=true 显式开启。
  dev-otp-enabled: ${AUTH_DEV_OTP_ENABLED:false}

app:
  # 演示数据总开关，同时管两件事：
  #   1) 启动时播种种子用户/社区帖子（SeedRunner.seedDefaults）
  #   2) 新账号首次登录时补一套演示菜单/购物清单/做菜记录/通知（AuthService）
  # 默认 true 便于本地开发与联调；生产由 application-prod.yml 固定 false，
  # 否则真实用户第一屏会出现"别人的"假菜单和假做菜记录。
  seed-demo-data: ${APP_SEED_DEMO_DATA:true}

upload:
  dir: ${UPLOAD_DIR:uploads}

admin:
  # 首次管理员的 openid 白名单（逗号分隔），仅用于启动时升权，只升不降。
  # 必须通过环境变量注入，禁止把真实 openid 写进代码或配置默认值；留空 = 不播种任何管理员。
  bootstrap-openids: ${ADMIN_OPENIDS:}
  # 引导登录：短信网关未接入（SMS_PROVIDER=noop）时 /admin 的唯一入口。
  # 令牌留空 = 功能关闭（端点返回 404）。两个都配上即可免验证码登录后台，
  # 登录目标由 bootstrap-phone 在服务端指定，浏览器端只需提交令牌。
  # 因此它等同于一把不过期的后台钥匙：只在进不去后台时临时设置，进去后立刻删掉并重启。
  bootstrap-token: ${ADMIN_BOOTSTRAP_TOKEN:}
  bootstrap-phone: ${ADMIN_BOOTSTRAP_PHONE:}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:9088,http://127.0.0.1:9088}

logging:
  level:
    com.familymenu.daily: ${LOG_LEVEL:info}
