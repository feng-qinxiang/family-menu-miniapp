# 生产环境配置（激活方式：SPRING_PROFILES_ACTIVE=prod）
#
# 本文件只放"生产必须与开发不同"的开关，凭据一律由环境变量注入，禁止写死。
# 启动前请核对 spec/LAUNCH-CHECKLIST.md 的环境变量清单。

spring:
  sql:
    init:
      # 生产绝不允许自动执行 schema.sql / data.sql：
      # - schema.sql 含 ALTER 语句，且历史上曾有 DROP COLUMN（破坏性）
      # - data.sql 会注入演示家庭 + 免费年卡会员
      # 建库/迁移请用 sql/create-database.sql + src/main/resources/schema.sql（一次性执行）。
      mode: never

# 生产固定关闭的两个调试开关：不随环境变量漂移。
# 它们是资损/账号接管级别的开关，只允许在本地开发显式打开。
auth:
  dev-otp-enabled: false

wechat:
  pay:
    mock-pay-enabled: false

app:
  # 生产不注入任何演示数据（种子用户/演示家庭/演示帖子）
  seed-demo-data: false

logging:
  level:
    com.familymenu.daily: ${LOG_LEVEL:info}

# 生产必须显式配置的项（留空即视为未配置，相关能力安全降级/拒绝）：
#   DB_HOST / DB_PORT / DB_NAME / DB_USERNAME / DB_PASSWORD  —— 强口令
#   WECHAT_APP_ID / WECHAT_APP_SECRET                        —— 微信登录 + 内容机审
#   ADMIN_OPENIDS                                            —— 首个管理员的 openid 白名单
#   CORS_ALLOWED_ORIGINS                                     —— 你的正式域名
#   UPLOAD_DIR                                               —— 绝对路径
#   WECHAT_PAY_*                                             —— 支付（含 PLATFORM_CERT_PATH 验签）
#   SPRING_SQL_INIT_MODE=never                               —— 本文件已固定
#
# 严禁在生产设置：
#   AUTH_DEV_OTP_ENABLED=true    （固定验证码 246810，等于任意手机号可登录）
#   WECHAT_PAY_MOCK_ENABLED=true （免付款直接开通会员）
