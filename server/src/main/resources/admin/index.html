<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="color-scheme" content="light" />
  <title>运营后台 · 家庭点菜</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232f4a3a'/%3E%3Ctext x='16' y='22' font-size='17' font-family='sans-serif' font-weight='700' fill='%23fff' text-anchor='middle'%3E%E5%AE%B6%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/admin/admin.css" />
</head>
<body>
  <!-- JS 关闭时的兜底提示（后台完全依赖 JS，白屏会让人以为是故障） -->
  <noscript>
    <div class="login-wrap">
      <div class="card" style="max-width:440px;margin:0;text-align:center">
        <h2>需要开启 JavaScript</h2>
        <p class="card-sub" style="margin-bottom:0">运营后台依赖 JavaScript 运行，请在浏览器设置中启用后重新打开本页。</p>
      </div>
    </div>
  </noscript>

  <!-- 登录态 -->
  <div id="loginView" class="login-wrap">
    <div class="login-shell">
      <!-- 左侧品牌区 -->
      <aside class="login-brand">
        <span class="brand-mark" aria-hidden="true">家</span>
        <h1 class="brand-title">家庭点菜</h1>
        <p class="brand-sub">运营后台</p>
        <ul class="brand-points">
          <li>内容审核 · 举报处置</li>
          <li>用户与会员管理</li>
          <li>全量操作审计留痕</li>
        </ul>
        <p class="brand-foot">© 2026 家庭点菜 · 内部系统，请勿外传</p>
      </aside>

      <!-- 右侧表单区 -->
      <section class="login-panel">
        <h2>登录</h2>
        <p class="login-hint">使用已绑定手机号的管理员账号登录</p>
        <form id="loginForm" autocomplete="off">
          <label for="phone">手机号</label>
          <div class="field">
            <span class="field-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2.5" width="10" height="19" rx="2.6"/><path d="M11 18.4h2"/></svg>
            </span>
            <input id="phone" name="phone" type="tel" inputmode="numeric" maxlength="11" placeholder="请输入 11 位手机号" required />
          </div>

          <label for="code">验证码</label>
          <div class="field-row">
            <div class="field">
              <span class="field-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5.6c0 4.2-2.9 7.9-7 9.4-4.1-1.5-7-5.2-7-9.4V6l7-3z"/><path d="M9.2 12.1l2 2 3.6-3.8"/></svg>
              </span>
              <input id="code" name="code" type="text" inputmode="numeric" maxlength="6" placeholder="6 位验证码" required />
            </div>
            <button id="sendOtpBtn" type="button" class="btn ghost">获取验证码</button>
          </div>

          <button id="loginBtn" type="submit" class="btn primary block">登 录</button>
          <div id="loginMsg" class="msg" role="alert" aria-live="polite"></div>
        </form>
        <p class="login-note">登录与所有管理操作都会写入审计日志</p>
      </section>
    </div>
  </div>

  <!-- 主界面：左侧导航 + 右侧内容 -->
  <div id="appView" class="app-shell" hidden>
    <div class="nav-backdrop" id="navBackdrop" hidden></div>

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <span class="brand-mark sm" aria-hidden="true">家</span>
        <div class="sidebar-brand-text">
          <div class="sidebar-title">家庭点菜</div>
          <div class="sidebar-sub">运营后台</div>
        </div>
      </div>
      <nav class="sidebar-nav" id="navList" aria-label="主导航"></nav>
      <div class="sidebar-foot">
        <div class="sidebar-user">
          <span class="avatar-me" id="adminAvatar" aria-hidden="true">管</span>
          <div class="sidebar-user-text">
            <span id="adminName" class="me-name">管理员</span>
            <span id="adminRole" class="me-role">管理员</span>
          </div>
        </div>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <button id="menuBtn" type="button" class="icon-btn" aria-label="展开导航">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <div class="topbar-text">
          <nav class="crumb" id="crumb" aria-label="面包屑"></nav>
          <h1 id="pageTitle">运营概览</h1>
        </div>
        <div class="topbar-tools">
          <span id="pageMeta" class="page-meta"></span>
          <div class="quick-jump">
            <svg class="qj-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg>
            <input id="quickJump" type="text" placeholder="跳转页面…" autocomplete="off"
                   aria-label="快速跳转到页面" aria-expanded="false" role="combobox" />
            <kbd class="qj-kbd">/</kbd>
            <div id="quickMenu" class="quick-menu" role="listbox" hidden></div>
          </div>
          <button id="refreshBtn" type="button" class="icon-btn" aria-label="刷新当前页" title="刷新">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-.6 3"/><path d="M20 5v6h-6"/></svg>
          </button>
          <div class="account">
            <button id="accountBtn" type="button" class="account-btn" aria-haspopup="menu" aria-expanded="false">
              <span class="account-avatar" id="accountAvatar" aria-hidden="true">管</span>
              <svg class="account-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
            </button>
            <div id="accountMenu" class="account-menu" role="menu" hidden></div>
          </div>
        </div>
      </header>

      <main id="panelRoot" class="panel-root"></main>
    </div>

    <div id="toast" class="toast" hidden></div>
    <div id="modalRoot" hidden></div>
  </div>

  <script src="/admin/admin.js" defer></script>
</body>
</html>
