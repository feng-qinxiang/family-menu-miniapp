name: miniapp-ci

# 小程序没有构建工具链，也没有编译器把关：
# WXSS 里多一个 `}` 之类的问题，git、编辑器都不报，只有微信开发者工具会白屏。
# 这个工作流把「机器能一眼看出来的错误」挡在合并之前。
on:
  push:
    paths:
      - 'miniapp/**'
      - '.github/workflows/miniapp-ci.yml'
  pull_request:
    paths:
      - 'miniapp/**'
      - '.github/workflows/miniapp-ci.yml'

jobs:
  static-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 静态自检（WXSS 配平 / 页面文件齐全 / 引用路径）
        run: node miniapp/test/static-check.js

      - name: 纯逻辑单测（点菜/菜谱）
        run: node miniapp/test/dish-logic.test.js

      - name: 纯逻辑单测（厨房/库存/周菜单）
        run: node miniapp/test/kitchen-logic.test.js

      # A 类（绑了事件却没按下反馈）是机械判定、没有误报，脚本对它 exit 1；
      # B / C 靠类名与尺寸启发式，文本链接本就不该有 88rpx 热区，脚本只报告不影响退出码。
      - name: 交互体检（A 类阻断，B/C 报告）
        run: node miniapp/test/interaction-audit.js
