<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>家庭点菜 · 空状态合集</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-font-smoothing:antialiased; }
  :root{
    --paper:#fbf8f3; --paper-2:#f0ebe2;
    --ink:#2c241b; --ink-deep:#3a2e23;
    --mut:#9a8e7d; --mut-2:#b3a795; --mut-strong:#7a6e5d;
    --gold:#f4d9a8; --gold-deep:#b08949;
    --pop:#e8472a; --pop-soft:#fdece6;
    --pine:#2f4a3a;
    --serif:"Georgia","Times New Roman",serif;
  }
  body {
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; background:#d9d2c7;
    font-family:-apple-system,"SF Pro Text","Helvetica Neue",Helvetica,Arial,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  }
  .phone {
    position:relative; width:390px; height:844px;
    background:var(--paper); border-radius:46px;
    box-shadow:0 30px 70px rgba(60,45,30,.4), 0 0 0 11px #1b1714, 0 0 0 12px #2c2520;
    overflow:hidden;
  }
  .status {
    position:absolute; top:0; left:0; right:0; height:50px; z-index:60;
    display:flex; align-items:center; justify-content:space-between;
    padding:0 30px 0 34px; color:var(--ink); font-size:15px; font-weight:600; pointer-events:none;
  }
  .status .right { display:flex; align-items:center; gap:7px; }
  .notch { position:absolute; top:11px; left:50%; transform:translateX(-50%); width:118px; height:33px; background:#1b1714; border-radius:20px; z-index:61; }
  .scroll { position:absolute; inset:0; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch; }
  .scroll::-webkit-scrollbar { display:none; }

  /* page header */
  .pghead { padding:62px 24px 8px; }
  .pghead .eyebrow { font-family:var(--serif); font-style:italic; font-size:12px; letter-spacing:1px; color:var(--gold-deep); font-weight:700; }
  .pghead h1 { font-size:30px; font-weight:900; color:var(--ink); letter-spacing:-1.5px; margin-top:5px; line-height:.96;
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif; }
  .pghead h1 .pop { color:var(--pop); }

  .stack { padding:18px 24px 40px; display:flex; flex-direction:column; gap:18px; }

  /* empty state card */
  .ecard { background:#fff; border-radius:26px; padding:32px 24px 28px; text-align:center;
    box-shadow:0 2px 6px rgba(60,40,20,.06), 0 16px 36px rgba(120,70,30,.13); border:1px solid #f1ece2; position:relative; overflow:hidden; }
  .ecard .tagidx { position:absolute; top:16px; left:18px; font-family:var(--serif); font-style:italic; font-size:11px; letter-spacing:1px; color:var(--mut-2); font-weight:700; }

  .illu { width:108px; height:108px; margin:0 auto 18px; display:flex; align-items:center; justify-content:center;
    border-radius:50%; background:var(--pop-soft); }
  .illu.gold { background:#f6efe1; }
  .illu.gray { background:var(--paper-2); }

  .ecard h2 { font-size:19px; font-weight:800; color:var(--ink); letter-spacing:-.4px; }
  .ecard p { font-size:13.5px; color:var(--mut-strong); margin-top:8px; line-height:1.5; }

  .btn { display:inline-flex; align-items:center; justify-content:center; gap:7px; margin-top:20px; min-height:46px;
    font-size:14.5px; font-weight:800; letter-spacing:.2px; padding:0 26px; border-radius:30px; }
  .btn-pop { background:var(--pop); color:#fff; box-shadow:0 8px 18px rgba(232,71,42,.35); }
  .btn-ghost { background:transparent; color:var(--gold-deep); border:1.5px solid #e7ddc9; }
  .btn:active { transform:scale(.97); }

  .home-ind { position:absolute; bottom:9px; left:50%; transform:translateX(-50%); width:134px; height:5px; border-radius:3px; background:#2c241b; opacity:.85; z-index:55; }
</style>
</head>
<body>
<div class="phone">
  <div class="notch"></div>
  <div class="status">
    <span>9:41</span>
    <span class="right">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="none"><rect x="0" y="7" width="3" height="5" rx="1" fill="#2c241b"/><rect x="5" y="4.5" width="3" height="7.5" rx="1" fill="#2c241b"/><rect x="10" y="2" width="3" height="10" rx="1" fill="#2c241b"/><rect x="15" y="0" width="3" height="12" rx="1" fill="#2c241b" opacity=".4"/></svg>
      <svg width="17" height="12" viewBox="0 0 17 12" fill="none"><path d="M8.5 2.5C11 2.5 13.2 3.5 14.8 5.1L8.5 11.4 2.2 5.1C3.8 3.5 6 2.5 8.5 2.5Z" fill="#2c241b"/></svg>
      <svg width="26" height="13" viewBox="0 0 26 13" fill="none"><rect x="1" y="1" width="21" height="11" rx="3" stroke="#2c241b" stroke-width="1.2" opacity=".5"/><rect x="3" y="3" width="16" height="7" rx="1.5" fill="#2c241b"/><rect x="23.5" y="4.5" width="2" height="4" rx="1" fill="#2c241b" opacity=".6"/></svg>
    </span>
  </div>

  <div class="scroll">
    <div class="pghead">
      <div class="eyebrow">空空如也</div>
      <h1>空状态<span class="pop">合集</span></h1>
    </div>

    <div class="stack">
      <!-- 1) 无菜谱 -->
      <div class="ecard">
        <span class="tagidx">01 — 还没菜谱</span>
        <div class="illu">
          <svg width="58" height="58" viewBox="0 0 64 64" fill="none" stroke="#e8472a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
            <ellipse cx="32" cy="40" rx="22" ry="9"/>
            <ellipse cx="32" cy="40" rx="11" ry="4.2" stroke-width="2.2" opacity=".55"/>
            <path d="M16 40c0-2 4-4 16-4s16 2 16 4" opacity=".35"/>
            <path d="M44 16l-3 9M50 16l-1.5 9" opacity=".7"/>
          </svg>
        </div>
        <h2>还没有菜谱</h2>
        <p>家里的拿手好菜，从第一道开始记录吧</p>
        <a class="btn btn-pop">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          去添加第一道
        </a>
      </div>

      <!-- 2) 无网络 -->
      <div class="ecard">
        <span class="tagidx">02 — 没网络</span>
        <div class="illu gray">
          <svg width="58" height="58" viewBox="0 0 64 64" fill="none" stroke="#7a6e5d" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 26c12.5-11 31.5-11 44 0" opacity=".4"/>
            <path d="M18 34c8-7 20-7 28 0" opacity=".65"/>
            <path d="M26 42c3.5-3 8.5-3 12 0"/>
            <circle cx="32" cy="50" r="1.6" fill="#7a6e5d" stroke="none"/>
            <path d="M50 16L14 52" stroke="#e8472a" stroke-width="3"/>
          </svg>
        </div>
        <h2>网络不太好</h2>
        <p>连接好像断开了，检查一下网络再试试</p>
        <a class="btn btn-ghost">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11A8 8 0 105.3 6.2"/><path d="M20 4v4h-4"/></svg>
          点击重试
        </a>
      </div>

      <!-- 3) 无搜索结果 -->
      <div class="ecard">
        <span class="tagidx">03 — 没找到</span>
        <div class="illu gold">
          <svg width="56" height="56" viewBox="0 0 64 64" fill="none" stroke="#b08949" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="27" cy="27" r="16"/>
            <path d="M39 39l13 13"/>
            <path d="M21 27h12M27 21v12" opacity=".5"/>
            <path d="M22 22l10 10" stroke="#e8472a" stroke-width="2.4"/>
          </svg>
        </div>
        <h2>没找到相关的菜</h2>
        <p>换个关键词，或看看「家里常做」的推荐</p>
        <a class="btn btn-ghost">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4l16 16M20 4L4 20"/></svg>
          清空搜索
        </a>
      </div>
    </div>
  </div>

  <div class="home-ind"></div>
</div>
</body>
</html>
