<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>邀请家人 · 家庭点菜</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-font-smoothing:antialiased; }
  :root{
    --paper:#fbf8f3; --paper-2:#f0ebe2;
    --ink:#2c241b; --ink-deep:#3a2e23;
    --mut:#9a8e7d; --mut-strong:#7a6e5d;
    --gold:#f4d9a8; --gold-deep:#b08949;
    --pop:#e8472a; --pop-soft:#fdece6;
    --wx:#07c160;
    --serif:"Georgia","Times New Roman",serif;
  }
  body {
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; background:#d9d2c7;
    font-family:-apple-system,"SF Pro Text","Helvetica Neue",Helvetica,Arial,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  }
  .phone {
    position:relative; width:390px; height:844px;
    background:var(--paper); border-radius:46px;
    box-shadow:0 30px 70px rgba(60,45,30,.4), 0 0 0 11px #1b1714, 0 0 0 12px #2c2520;
    overflow:hidden;
  }
  .status {
    position:absolute; top:0; left:0; right:0; height:50px; z-index:60;
    display:flex; align-items:center; justify-content:space-between;
    padding:0 30px 0 34px; color:var(--ink); font-size:15px; font-weight:600; pointer-events:none;
  }
  .status .right { display:flex; align-items:center; gap:7px; }
  .notch { position:absolute; top:11px; left:50%; transform:translateX(-50%); width:118px; height:33px; background:#1b1714; border-radius:20px; z-index:61; }
  .scroll { position:absolute; inset:0; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch; }
  .scroll::-webkit-scrollbar { display:none; }

  .nav { position:relative; z-index:20; display:flex; align-items:center; justify-content:space-between; padding:62px 24px 8px; }
  .backbtn { width:44px; height:44px; border-radius:50%; background:var(--ink-deep); display:flex; align-items:center; justify-content:center; box-shadow:0 6px 16px rgba(60,40,20,.22); }
  .nav h1 { font-size:21px; font-weight:900; color:var(--ink); letter-spacing:-.6px; font-family:"PingFang SC","Microsoft YaHei",sans-serif; }
  .nav h1 .pop { color:var(--pop); }
  .nav .ph44 { width:44px; height:44px; }

  .wrap { padding:14px 24px 60px; }
  .eyebrow { font-family:var(--serif); font-style:italic; font-size:12px; letter-spacing:1px; color:var(--gold-deep); font-weight:700; text-align:center; }
  .intro-t { font-size:30px; font-weight:900; color:var(--ink); letter-spacing:-1.2px; line-height:1; text-align:center; margin-top:7px; font-family:"PingFang SC","Microsoft YaHei",sans-serif; }
  .intro-t .pop { color:var(--pop); }

  /* invite card */
  .invite { margin-top:24px; background:var(--ink-deep); border-radius:28px; padding:30px 26px 26px; color:var(--paper); position:relative; overflow:hidden;
    box-shadow:0 2px 6px rgba(60,40,20,.06), 0 18px 40px rgba(120,70,30,.22); }
  .invite::after { content:""; position:absolute; right:-40px; top:-40px; width:160px; height:160px; border-radius:50%; background:rgba(232,71,42,.16); }
  .invite::before { content:""; position:absolute; left:-30px; bottom:-46px; width:130px; height:130px; border-radius:50%; background:rgba(244,217,168,.08); }
  .iv-cap { font-family:var(--serif); font-style:italic; font-size:12px; letter-spacing:1px; color:var(--gold); font-weight:700; text-align:center; position:relative; z-index:2; }
  .code { display:flex; justify-content:center; gap:9px; margin-top:14px; position:relative; z-index:2; }
  .code .dg { width:42px; height:56px; border-radius:12px; background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.14); display:flex; align-items:center; justify-content:center;
    font-family:var(--serif); font-size:32px; font-weight:700; color:#fff; }
  .copybtn { margin:18px auto 0; position:relative; z-index:2; display:flex; align-items:center; justify-content:center; gap:7px;
    background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.2); color:#fff; font-size:13.5px; font-weight:700; padding:11px 0; border-radius:30px; width:100%; }

  /* qr */
  .qrwrap { margin:22px auto 0; position:relative; z-index:2; width:172px; height:172px; background:#fff; border-radius:20px; padding:14px; box-shadow:0 10px 26px rgba(0,0,0,.25); }
  .qrwrap svg { display:block; width:100%; height:100%; }
  .qr-hint { text-align:center; font-size:11px; color:rgba(255,255,255,.6); letter-spacing:.5px; margin-top:13px; position:relative; z-index:2; }

  /* actions */
  .wxbtn { margin-top:26px; width:100%; background:var(--wx); color:#fff; font-size:16px; font-weight:800; padding:16px 0; border-radius:18px; display:flex; align-items:center; justify-content:center; gap:9px; box-shadow:0 10px 24px rgba(7,193,96,.32); }
  .savebtn { margin-top:13px; width:100%; background:#fff; color:var(--ink); font-size:15px; font-weight:700; padding:15px 0; border-radius:18px; display:flex; align-items:center; justify-content:center; gap:9px; border:1px solid #ece5d9; box-shadow:0 2px 6px rgba(60,40,20,.06); }

  .note { display:flex; align-items:flex-start; gap:9px; margin-top:24px; padding:14px 16px; background:var(--pop-soft); border-radius:16px; }
  .note .ic { flex:none; margin-top:1px; }
  .note p { font-size:12.5px; line-height:1.6; color:var(--mut-strong); }
  .note p b { color:var(--pop); font-weight:800; }

  .home-ind { position:absolute; bottom:9px; left:50%; transform:translateX(-50%); width:134px; height:5px; border-radius:3px; background:#2c241b; opacity:.85; z-index:55; }
  .backbtn:active, .copybtn:active, .wxbtn:active, .savebtn:active { transform:scale(.97); }
</style>
</head>
<body>
<div class="phone">
  <div class="notch"></div>
  <div class="status">
    <span>9:41</span>
    <span class="right">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="none"><rect x="0" y="7" width="3" height="5" rx="1" fill="#2c241b"/><rect x="5" y="4.5" width="3" height="7.5" rx="1" fill="#2c241b"/><rect x="10" y="2" width="3" height="10" rx="1" fill="#2c241b"/><rect x="15" y="0" width="3" height="12" rx="1" fill="#2c241b" opacity=".4"/></svg>
      <svg width="17" height="12" viewBox="0 0 17 12" fill="none"><path d="M8.5 2.5C11 2.5 13.2 3.5 14.8 5.1L8.5 11.4 2.2 5.1C3.8 3.5 6 2.5 8.5 2.5Z" fill="#2c241b"/></svg>
      <svg width="26" height="13" viewBox="0 0 26 13" fill="none"><rect x="1" y="1" width="21" height="11" rx="3" stroke="#2c241b" stroke-width="1.2" opacity=".5"/><rect x="3" y="3" width="16" height="7" rx="1.5" fill="#2c241b"/><rect x="23.5" y="4.5" width="2" height="4" rx="1" fill="#2c241b" opacity=".6"/></svg>
    </span>
  </div>

  <div class="scroll">
    <div class="nav">
      <div class="backbtn"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#fbf8f3" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></div>
      <h1>邀请<span class="pop">家人</span></h1>
      <div class="ph44"></div>
    </div>

    <div class="wrap">
      <div class="eyebrow">叫上一家人</div>
      <div class="intro-t">把<span class="pop">餐桌</span>分享给家人</div>

      <div class="invite">
        <div class="iv-cap">家庭邀请码</div>
        <div class="code">
          <div class="dg">8</div><div class="dg">3</div><div class="dg">6</div><div class="dg">2</div><div class="dg">9</div><div class="dg">5</div>
        </div>
        <div class="copybtn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 012-2h10"/></svg>
          复制邀请码
        </div>

        <div class="qrwrap">
          <svg viewBox="0 0 29 29" shape-rendering="crispEdges" fill="#2c241b">
            <rect x="0" y="0" width="7" height="7"/><rect x="1" y="1" width="5" height="5" fill="#fff"/><rect x="2" y="2" width="3" height="3"/>
            <rect x="22" y="0" width="7" height="7"/><rect x="23" y="1" width="5" height="5" fill="#fff"/><rect x="24" y="2" width="3" height="3"/>
            <rect x="0" y="22" width="7" height="7"/><rect x="1" y="23" width="5" height="5" fill="#fff"/><rect x="2" y="24" width="3" height="3"/>
            <rect x="9" y="1" width="1" height="1"/><rect x="11" y="0" width="1" height="2"/><rect x="13" y="1" width="2" height="1"/><rect x="16" y="0" width="1" height="1"/><rect x="18" y="1" width="2" height="1"/>
            <rect x="9" y="3" width="2" height="1"/><rect x="12" y="3" width="1" height="2"/><rect x="14" y="4" width="2" height="1"/><rect x="17" y="3" width="1" height="2"/><rect x="19" y="4" width="1" height="1"/>
            <rect x="8" y="6" width="1" height="1"/><rect x="10" y="5" width="1" height="2"/><rect x="13" y="6" width="2" height="1"/><rect x="16" y="6" width="1" height="1"/><rect x="18" y="5" width="1" height="1"/><rect x="20" y="6" width="1" height="1"/>
            <rect x="0" y="9" width="1" height="2"/><rect x="2" y="10" width="2" height="1"/><rect x="5" y="9" width="1" height="1"/><rect x="6" y="11" width="1" height="2"/><rect x="4" y="12" width="1" height="1"/>
            <rect x="8" y="9" width="2" height="1"/><rect x="11" y="9" width="1" height="2"/><rect x="13" y="10" width="2" height="2"/><rect x="16" y="9" width="2" height="1"/><rect x="19" y="9" width="1" height="2"/><rect x="21" y="10" width="2" height="1"/>
            <rect x="24" y="9" width="1" height="1"/><rect x="26" y="9" width="1" height="2"/><rect x="28" y="10" width="1" height="2"/><rect x="25" y="11" width="2" height="1"/>
            <rect x="9" y="13" width="1" height="2"/><rect x="11" y="13" width="2" height="1"/><rect x="14" y="14" width="1" height="2"/><rect x="16" y="13" width="2" height="1"/><rect x="19" y="14" width="1" height="1"/><rect x="21" y="13" width="1" height="2"/><rect x="23" y="14" width="2" height="1"/><rect x="26" y="13" width="1" height="1"/><rect x="28" y="14" width="1" height="2"/>
            <rect x="1" y="13" width="2" height="1"/><rect x="4" y="13" width="1" height="2"/><rect x="6" y="14" width="1" height="1"/>
            <rect x="9" y="16" width="2" height="1"/><rect x="12" y="16" width="1" height="2"/><rect x="14" y="17" width="2" height="1"/><rect x="17" y="16" width="1" height="2"/><rect x="20" y="16" width="2" height="1"/><rect x="23" y="17" width="1" height="2"/><rect x="25" y="16" width="2" height="1"/><rect x="28" y="17" width="1" height="2"/>
            <rect x="1" y="16" width="1" height="2"/><rect x="3" y="17" width="2" height="1"/><rect x="6" y="16" width="1" height="2"/>
            <rect x="9" y="19" width="1" height="2"/><rect x="11" y="20" width="2" height="1"/><rect x="14" y="19" width="1" height="2"/><rect x="16" y="20" width="2" height="1"/><rect x="19" y="19" width="1" height="2"/><rect x="21" y="20" width="2" height="1"/><rect x="24" y="19" width="1" height="2"/><rect x="26" y="20" width="2" height="1"/>
            <rect x="8" y="22" width="2" height="1"/><rect x="11" y="22" width="1" height="2"/><rect x="13" y="23" width="2" height="1"/><rect x="16" y="22" width="1" height="2"/><rect x="18" y="23" width="2" height="1"/><rect x="21" y="22" width="2" height="1"/><rect x="24" y="23" width="1" height="2"/><rect x="26" y="22" width="2" height="1"/>
            <rect x="9" y="25" width="1" height="2"/><rect x="11" y="25" width="2" height="1"/><rect x="14" y="26" width="1" height="2"/><rect x="16" y="25" width="2" height="1"/><rect x="19" y="26" width="1" height="2"/><rect x="21" y="25" width="2" height="1"/><rect x="24" y="26" width="1" height="2"/><rect x="26" y="25" width="2" height="1"/>
            <rect x="8" y="28" width="2" height="1"/><rect x="12" y="28" width="2" height="1"/><rect x="15" y="28" width="1" height="1"/><rect x="18" y="28" width="2" height="1"/><rect x="22" y="28" width="1" height="1"/><rect x="25" y="28" width="2" height="1"/>
          </svg>
        </div>
        <div class="qr-hint">微信扫一扫，加入这桌</div>
      </div>

      <div class="wxbtn">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="#fff"><path d="M9 3C4.9 3 1.6 5.8 1.6 9.2c0 1.9 1.1 3.6 2.7 4.8l-.7 2 2.3-1.2c.9.3 1.9.4 2.8.4h.6a4.9 4.9 0 01-.2-1.4c0-3 2.9-5.3 6.5-5.3h.6C15.7 5.2 12.7 3 9 3zM6.6 7.9a.9.9 0 110-1.8.9.9 0 010 1.8zm4.8 0a.9.9 0 110-1.8.9.9 0 010 1.8z"/><path d="M22.4 13.5c0-2.8-2.7-5-6-5s-6 2.2-6 5 2.7 5 6 5c.7 0 1.4-.1 2-.3l1.9 1-.5-1.7c1.6-.9 2.6-2.4 2.6-4zm-7.9-.8a.7.7 0 110-1.5.7.7 0 010 1.5zm3.9 0a.7.7 0 110-1.5.7.7 0 010 1.5z"/></svg>
        微信分享给家人
      </div>
      <div class="savebtn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2c241b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"/><path d="M8 11l4 4 4-4"/><path d="M5 19h14"/></svg>
        保存邀请图
      </div>

      <div class="note">
        <span class="ic"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#e8472a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><circle cx="12" cy="7.6" r=".4" fill="#e8472a"/></svg></span>
        <p>家人<b>扫码</b>或在小程序里<b>输入邀请码</b>即可加入这桌，一起点菜、凑齐今晚的菜单。邀请码 24 小时内有效。</p>
      </div>
    </div>
  </div>

  <div class="home-ind"></div>
</div>
</body>
</html>
