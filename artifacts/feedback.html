<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>意见反馈 · 家庭点菜</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-font-smoothing:antialiased; }
  :root{
    --paper:#fbf8f3; --paper-2:#f0ebe2;
    --ink:#2c241b; --ink-deep:#3a2e23;
    --mut:#9a8e7d; --mut-strong:#7a6e5d;
    --gold:#f4d9a8; --gold-deep:#b08949;
    --pop:#e8472a; --pop-soft:#fdece6;
    --serif:"Georgia","Times New Roman",serif;
  }
  body {
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; background:#d9d2c7;
    font-family:-apple-system,"SF Pro Text","Helvetica Neue",Helvetica,Arial,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  }
  .phone {
    position:relative; width:390px; height:844px;
    background:var(--paper); border-radius:46px;
    box-shadow:0 30px 70px rgba(60,45,30,.4), 0 0 0 11px #1b1714, 0 0 0 12px #2c2520;
    overflow:hidden;
  }
  .status {
    position:absolute; top:0; left:0; right:0; height:50px; z-index:60;
    display:flex; align-items:center; justify-content:space-between;
    padding:0 30px 0 34px; color:var(--ink); font-size:15px; font-weight:600; pointer-events:none;
  }
  .status .right { display:flex; align-items:center; gap:7px; }
  .notch { position:absolute; top:11px; left:50%; transform:translateX(-50%); width:118px; height:33px; background:#1b1714; border-radius:20px; z-index:61; }
  .scroll { position:absolute; inset:0; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch; }
  .scroll::-webkit-scrollbar { display:none; }

  .nav { position:relative; padding:62px 24px 8px; display:flex; align-items:center; justify-content:space-between; }
  .backbtn { width:44px; height:44px; border-radius:50%; background:var(--ink-deep); display:flex; align-items:center; justify-content:center; flex:none; box-shadow:0 6px 16px rgba(60,40,20,.22); }
  .nav .submit-top { font-size:13.5px; font-weight:800; color:var(--gold-deep); padding:6px 4px; }

  .head { padding:14px 24px 6px; }
  .head .eyebrow { font-family:var(--serif); font-style:italic; font-size:12.5px; letter-spacing:1px; color:var(--gold-deep); font-weight:700; }
  .head h1 { font-size:40px; font-weight:900; color:var(--ink); letter-spacing:-2px; margin-top:5px; line-height:.95;
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif; }
  .head h1 .pop { color:var(--pop); }
  .head .desc { font-size:13px; color:var(--mut-strong); margin-top:10px; line-height:1.5; }

  .sec { padding:0 24px; margin-top:26px; }
  .sec-label { font-size:12px; font-weight:800; letter-spacing:1px; color:var(--ink-deep); text-transform:uppercase; margin-bottom:13px; display:flex; align-items:center; gap:7px; }
  .sec-label .star { color:var(--pop); }

  .chips { display:flex; flex-wrap:wrap; gap:10px; }
  .chip { font-size:13.5px; font-weight:700; color:var(--mut-strong); padding:10px 18px; border-radius:30px; background:var(--paper-2); border:1.5px solid transparent; display:flex; align-items:center; gap:6px; }
  .chip.on { background:var(--pop-soft); color:var(--pop); border-color:var(--pop); }
  .chip:active { transform:scale(.97); }

  .ta-wrap { position:relative; background:#fff; border-radius:20px; border:1px solid #efe9df; box-shadow:0 2px 6px rgba(60,40,20,.06), 0 18px 40px rgba(120,70,30,.14); padding:16px 16px 38px; }
  textarea { width:100%; height:128px; border:none; outline:none; resize:none; font-size:15px; line-height:1.6; color:var(--ink); background:transparent;
    font-family:inherit; }
  textarea::placeholder { color:var(--mut); }
  .counter { position:absolute; right:16px; bottom:13px; font-size:11.5px; color:var(--mut); font-weight:600; }

  .uploads { display:flex; gap:12px; }
  .up-img { width:84px; height:84px; border-radius:16px; background-size:cover; background-position:center; position:relative; flex:none; box-shadow:0 2px 6px rgba(60,40,20,.1); }
  .up-img .del { position:absolute; top:-7px; right:-7px; width:24px; height:24px; border-radius:50%; background:var(--ink-deep); display:flex; align-items:center; justify-content:center; box-shadow:0 2px 5px rgba(0,0,0,.25); }
  .up-add { width:84px; height:84px; border-radius:16px; border:2px dashed #cdbfa8; background:var(--paper-2); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px; flex:none; }
  .up-add .t { font-size:10.5px; color:var(--mut-strong); font-weight:700; }
  .up-add:active { transform:scale(.97); }

  .input-wrap { background:#fff; border-radius:18px; border:1px solid #efe9df; box-shadow:0 2px 6px rgba(60,40,20,.06); padding:0 16px; display:flex; align-items:center; gap:11px; height:54px; }
  .input-wrap input { flex:1; border:none; outline:none; font-size:14.5px; color:var(--ink); background:transparent; font-family:inherit; }
  .input-wrap input::placeholder { color:var(--mut); }

  .submit-area { padding:30px 24px 40px; }
  .submit { width:100%; height:56px; border-radius:18px; background:var(--pop); color:#fff; font-size:16px; font-weight:800; letter-spacing:.5px; border:none; display:flex; align-items:center; justify-content:center; gap:8px;
    box-shadow:0 8px 22px rgba(232,71,42,.4), 0 2px 4px rgba(180,40,20,.3); }
  .submit:active { transform:scale(.97); }
  .hint { text-align:center; font-size:11.5px; color:var(--mut-strong); margin-top:14px; }
  .home-ind { position:absolute; bottom:9px; left:50%; transform:translateX(-50%); width:134px; height:5px; border-radius:3px; background:#2c241b; opacity:.85; z-index:55; }
</style>
</head>
<body>
<div class="phone">
  <div class="notch"></div>
  <div class="status">
    <span>9:41</span>
    <span class="right">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="none"><rect x="0" y="7" width="3" height="5" rx="1" fill="#2c241b"/><rect x="5" y="4.5" width="3" height="7.5" rx="1" fill="#2c241b"/><rect x="10" y="2" width="3" height="10" rx="1" fill="#2c241b"/><rect x="15" y="0" width="3" height="12" rx="1" fill="#2c241b" opacity=".4"/></svg>
      <svg width="17" height="12" viewBox="0 0 17 12" fill="none"><path d="M8.5 2.5C11 2.5 13.2 3.5 14.8 5.1L8.5 11.4 2.2 5.1C3.8 3.5 6 2.5 8.5 2.5Z" fill="#2c241b"/></svg>
      <svg width="26" height="13" viewBox="0 0 26 13" fill="none"><rect x="1" y="1" width="21" height="11" rx="3" stroke="#2c241b" stroke-width="1.2" opacity=".5"/><rect x="3" y="3" width="16" height="7" rx="1.5" fill="#2c241b"/><rect x="23.5" y="4.5" width="2" height="4" rx="1" fill="#2c241b" opacity=".6"/></svg>
    </span>
  </div>

  <div class="scroll">
    <div class="nav">
      <div class="backbtn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fbf8f3" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></div>
      <span class="submit-top">提交</span>
    </div>

    <div class="head">
      <div class="eyebrow">We're listening</div>
      <h1>意见<span class="pop">反馈</span></h1>
      <div class="desc">你的每一条想法，都让这桌饭更合口味。</div>
    </div>

    <div class="sec">
      <div class="sec-label"><span class="star">*</span>反馈类型</div>
      <div class="chips">
        <div class="chip on">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 00-4 10.5c.8.7 1 1 1 2v.5h6V16c0-1 .2-1.3 1-2A6 6 0 0012 3z"/></svg>
          功能建议
        </div>
        <div class="chip">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="6" width="8" height="12" rx="4"/><path d="M5 9l3 1M5 15l3-1M19 9l-3 1M19 15l-3-1M9 4l2 2M15 4l-2 2"/></svg>
          问题反馈
        </div>
        <div class="chip">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 9.5a3 3 0 015-1.5c.8 1 .3 2-1 2.7-.8.5-1 1-1 1.8M12 16.5h.01"/></svg>
          体验问题
        </div>
        <div class="chip">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="18" cy="12" r="1.4"/></svg>
          其他
        </div>
      </div>
    </div>

    <div class="sec">
      <div class="sec-label"><span class="star">*</span>详细描述</div>
      <div class="ta-wrap">
        <textarea placeholder="说说你的想法...&#10;比如想要的新功能、用着不顺手的地方、菜谱建议等。"></textarea>
        <span class="counter">0 / 500</span>
      </div>
    </div>

    <div class="sec">
      <div class="sec-label">上传图片 <span style="color:var(--mut-strong); font-weight:600; text-transform:none; letter-spacing:0;">（选填 · 最多 3 张）</span></div>
      <div class="uploads">
        <div class="up-img" style="background-image:url('img/tomato-egg.jpg')">
          <div class="del"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#fbf8f3" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></div>
        </div>
        <div class="up-add">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#7a6e5d" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          <span class="t">1/3</span>
        </div>
      </div>
    </div>

    <div class="sec">
      <div class="sec-label">联系方式 <span style="color:var(--mut-strong); font-weight:600; text-transform:none; letter-spacing:0;">（选填）</span></div>
      <div class="input-wrap">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#b08949" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
        <input type="text" placeholder="手机号或微信，方便我们回复你">
      </div>
    </div>

    <div class="submit-area">
      <button class="submit">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg>
        提交反馈
      </button>
      <div class="hint">通常 1–2 个工作日内回复</div>
    </div>
  </div>

  <div class="home-ind"></div>
</div>
</body>
</html>
