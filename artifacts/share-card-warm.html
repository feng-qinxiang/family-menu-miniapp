<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>分享海报 · 家庭点菜</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-font-smoothing:antialiased; }
  :root{
    --paper:#fbf8f3; --paper-2:#f0ebe2;
    --ink:#2c241b; --ink-deep:#3a2e23;
    --mut:#9a8e7d; --mut-strong:#7a6e5d;
    --gold:#f4d9a8; --gold-deep:#b08949;
    --pop:#e8472a; --pop-soft:#fdece6;
    --serif:"Georgia","Times New Roman",serif;
  }
  body {
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; background:#d9d2c7;
    font-family:-apple-system,"SF Pro Text","Helvetica Neue",Helvetica,Arial,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  }
  .phone {
    position:relative; width:390px; height:844px;
    background:var(--paper); border-radius:46px;
    box-shadow:0 30px 70px rgba(60,45,30,.4), 0 0 0 11px #1b1714, 0 0 0 12px #2c2520;
    overflow:hidden;
  }
  .status {
    position:absolute; top:0; left:0; right:0; height:50px; z-index:60;
    display:flex; align-items:center; justify-content:space-between;
    padding:0 30px 0 34px; color:#fff; font-size:15px; font-weight:600; pointer-events:none;
  }
  .status .right { display:flex; align-items:center; gap:7px; }
  .notch { position:absolute; top:11px; left:50%; transform:translateX(-50%); width:118px; height:33px; background:#1b1714; border-radius:20px; z-index:61; }

  /* dim backdrop */
  .backdrop { position:absolute; inset:0; z-index:1;
    background:radial-gradient(130% 90% at 50% 18%, rgba(58,46,35,.78), rgba(20,14,8,.94)); }

  .share-top { position:absolute; top:60px; left:24px; right:24px; z-index:20; display:flex; align-items:center; justify-content:space-between; }
  .share-top .ttl { color:#fff; font-size:16px; font-weight:700; letter-spacing:.3px; }
  .closebtn { width:38px; height:38px; border-radius:50%; background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.2); display:flex; align-items:center; justify-content:center; }

  /* poster card */
  .poster { position:absolute; top:108px; left:50%; transform:translateX(-50%); z-index:15;
    width:300px; background:#fff; border-radius:26px; overflow:hidden;
    box-shadow:0 2px 6px rgba(60,40,20,.06), 0 30px 60px rgba(10,6,2,.55); }
  .poster .pic { position:relative; height:262px; background:url('img/hongshao-pork.jpg') center/cover no-repeat; }
  .poster .pic::after { content:""; position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(20,14,8,.36) 0%, rgba(20,14,8,0) 32%, rgba(20,14,8,0) 56%, rgba(20,14,8,.86) 100%); }
  .poster .pbadge { position:absolute; top:14px; left:14px; z-index:2;
    font-family:var(--serif); font-style:italic; font-size:11px; letter-spacing:1.3px; font-weight:700;
    color:#fff; background:var(--pop); padding:5px 12px; border-radius:4px; }
  .poster .pname { position:absolute; left:18px; right:18px; bottom:16px; z-index:2; }
  .poster .pname .eyebrow { font-family:var(--serif); font-style:italic; font-size:11.5px; letter-spacing:1px; color:var(--gold); font-weight:700; }
  .poster .pname h2 { font-size:34px; font-weight:900; color:#fff; letter-spacing:-1.5px; margin-top:3px; line-height:.96;
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif; }

  .poster .pbody { padding:16px 18px 18px; }
  .poster .pmeta { display:flex; gap:8px; }
  .poster .pmeta .m { display:flex; align-items:center; gap:5px; font-size:11.5px; font-weight:600; color:var(--mut-strong);
    background:var(--paper-2); padding:6px 11px; border-radius:20px; }
  .poster .pquote { font-family:var(--serif); font-style:italic; font-size:13px; color:var(--ink-deep); margin-top:13px; line-height:1.5; }
  .poster .pquote::before { content:"\201C"; color:var(--pop); font-size:22px; vertical-align:-6px; margin-right:1px; }

  .poster .pfoot { display:flex; align-items:center; gap:13px; margin-top:16px; padding-top:16px; border-top:1px dashed #e4ddcf; }
  .qr { width:74px; height:74px; flex:none; border-radius:12px; background:var(--paper); padding:6px; box-shadow:inset 0 0 0 1px #ece5d9; }
  .pfoot .ftxt { flex:1; min-width:0; }
  .pfoot .ftxt .scan { font-size:13px; font-weight:800; color:var(--ink); letter-spacing:-.2px; }
  .pfoot .ftxt .scan .pop { color:var(--pop); }
  .pfoot .ftxt .app { display:flex; align-items:center; gap:6px; margin-top:7px; }
  .pfoot .ftxt .logo { width:22px; height:22px; border-radius:7px; background:var(--pop); display:flex; align-items:center; justify-content:center; box-shadow:0 3px 8px rgba(232,71,42,.35); }
  .pfoot .ftxt .appname { font-size:12px; font-weight:800; color:var(--ink-deep); }
  .pfoot .ftxt .appname .ser { font-family:var(--serif); font-style:italic; font-weight:700; color:var(--gold-deep); font-size:11px; margin-left:3px; }

  /* actions */
  .actions { position:absolute; left:0; right:0; bottom:0; z-index:25;
    background:rgba(251,248,243,.97); backdrop-filter:blur(18px); border-radius:26px 26px 0 0;
    padding:24px 24px calc(24px + env(safe-area-inset-bottom)); box-shadow:0 -18px 40px rgba(10,6,2,.3); }
  .actions .ahint { text-align:center; font-size:12px; color:var(--mut-strong); margin-bottom:20px; letter-spacing:.3px; }
  .agrid { display:flex; justify-content:space-between; }
  .act { display:flex; flex-direction:column; align-items:center; gap:9px; flex:1; }
  .act .ic { width:54px; height:54px; border-radius:18px; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 6px rgba(60,40,20,.06), 0 10px 22px rgba(120,70,30,.12); }
  .act .ic.wx { background:#07c160; }
  .act .ic.pyq { background:#fff; border:1px solid #efe9df; }
  .act .ic.save { background:var(--ink-deep); }
  .act .ic.link { background:#fff; border:1px solid #efe9df; }
  .act .lab { font-size:11.5px; font-weight:600; color:var(--mut-strong); }
  .cancelbtn { margin-top:22px; width:100%; height:50px; border-radius:16px; background:var(--paper-2); border:none;
    font-size:15px; font-weight:700; color:var(--ink-deep); display:flex; align-items:center; justify-content:center; }

  .closebtn:active, .cancelbtn:active, .poster:active { transform:scale(.98); }
  .act:active { transform:scale(.94); }
</style>
</head>
<body>
<div class="phone">
  <div class="status">
    <span>9:41</span>
    <span class="right">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="none"><rect x="0" y="7" width="3" height="5" rx="1" fill="#fff"/><rect x="5" y="4.5" width="3" height="7.5" rx="1" fill="#fff"/><rect x="10" y="2" width="3" height="10" rx="1" fill="#fff"/><rect x="15" y="0" width="3" height="12" rx="1" fill="#fff" opacity=".4"/></svg>
      <svg width="17" height="12" viewBox="0 0 17 12" fill="none"><path d="M8.5 2.5C11 2.5 13.2 3.5 14.8 5.1L8.5 11.4 2.2 5.1C3.8 3.5 6 2.5 8.5 2.5Z" fill="#fff"/></svg>
      <svg width="26" height="13" viewBox="0 0 26 13" fill="none"><rect x="1" y="1" width="21" height="11" rx="3" stroke="#fff" stroke-width="1.2" opacity=".5"/><rect x="3" y="3" width="16" height="7" rx="1.5" fill="#fff"/><rect x="23.5" y="4.5" width="2" height="4" rx="1" fill="#fff" opacity=".6"/></svg>
    </span>
  </div>
  <div class="notch"></div>

  <div class="backdrop"></div>

  <div class="share-top">
    <div class="ttl">分享这道菜</div>
    <div class="closebtn"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></div>
  </div>

  <!-- POSTER -->
  <div class="poster">
    <div class="pic">
      <span class="pbadge">今天这一桌</span>
      <div class="pname">
        <div class="eyebrow">小张家的拿手菜</div>
        <h2>红烧肉</h2>
      </div>
    </div>
    <div class="pbody">
      <div class="pmeta">
        <span class="m"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2" stroke-linecap="round"/></svg>50 分钟</span>
        <span class="m">本帮菜</span>
        <span class="m">做过 6 次</span>
      </div>
      <div class="pquote">肥而不腻，入口即化，全家最爱的一道硬菜。</div>
      <div class="pfoot">
        <svg class="qr" viewBox="0 0 62 62" shape-rendering="crispEdges">
          <rect width="62" height="62" fill="#fff"/>
          <path fill="#2c241b" d="M4 4h18v18H4zM7 7v12h12V7zm3 3h6v6h-6z M40 4h18v18H40zM43 7v12h12V7zm3 3h6v6h-6z M4 40h18v18H4zM7 43v12h12V43zm3 3h6v6h-6z"/>
          <path fill="#2c241b" d="M26 4h3v3h-3zM31 4h3v6h-3zM26 9h3v3h-3z M4 26h3v3H4zM9 26h6v3H9zM18 26h4v3h-4z M26 13h3v4h-3zM31 13h6v3h-6zM26 19h6v3h-6z M40 26h3v3h-3zM45 26h3v6h-3zM50 26h3v3h-3zM55 26h3v3h-3z M40 31h6v3h-6zM50 33h3v3h-3zM55 31h3v6h-3z M26 26h3v3h-3zM31 26h6v3h-6zM26 31h3v6h-3zM33 33h3v3h-3z M40 40h3v3h-3zM45 40h6v3h-6zM55 40h3v3h-3z M40 45h6v3h-6zM48 48h3v3h-3zM40 50h3v6h-3zM45 50h3v3h-3zM50 45h3v6h-3zM55 45h3v6h-3zM45 55h6v3h-6zM55 55h3v3h-3zM26 40h3v3h-3zM31 43h3v3h-3zM26 48h6v3h-6zM31 53h3v5h-3z"/>
        </svg>
        <div class="ftxt">
          <div class="scan">长按识别，<span class="pop">一起来点菜</span></div>
          <div class="app">
            <span class="logo"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h11a2 2 0 012 2v14l-7-3-6 3V4z"/></svg></span>
            <span class="appname">家庭点菜<span class="ser">今天这一桌</span></span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ACTIONS -->
  <div class="actions">
    <div class="ahint">把今晚的菜，分享给家人一起点</div>
    <div class="agrid">
      <div class="act">
        <div class="ic wx"><svg width="26" height="26" viewBox="0 0 24 24" fill="#fff"><path d="M9 3C5 3 1.8 5.7 1.8 9c0 1.9 1.1 3.6 2.8 4.7L4 16l2.6-1.3c.8.2 1.6.3 2.4.3h.6a4.8 4.8 0 01-.2-1.4c0-3 2.9-5.3 6.4-5.3h.6C16 5.2 12.9 3 9 3zm-2.4 4a1 1 0 110 2 1 1 0 010-2zm4.8 0a1 1 0 110 2 1 1 0 010-2z"/><path d="M22.2 13.6c0-2.6-2.6-4.6-5.6-4.6s-5.6 2-5.6 4.6 2.6 4.6 5.6 4.6c.6 0 1.2-.1 1.8-.3L20 19l-.4-1.6c1.5-.9 2.6-2.2 2.6-3.8zm-7.4-1a.8.8 0 110 1.6.8.8 0 010-1.6zm3.6 0a.8.8 0 110 1.6.8.8 0 010-1.6z"/></svg></div>
        <span class="lab">微信好友</span>
      </div>
      <div class="act">
        <div class="ic pyq"><svg width="25" height="25" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9.2" stroke="#07c160" stroke-width="1.8"/><circle cx="12" cy="12" r="3.4" fill="#07c160"/><circle cx="12" cy="4.6" r="1.5" fill="#f0a020"/><circle cx="18.4" cy="8.3" r="1.5" fill="#e8472a"/><circle cx="18.4" cy="15.7" r="1.5" fill="#3b82f6"/><circle cx="12" cy="19.4" r="1.5" fill="#8b5cf6"/><circle cx="5.6" cy="15.7" r="1.5" fill="#07c160"/><circle cx="5.6" cy="8.3" r="1.5" fill="#f0a020"/></svg></div>
        <span class="lab">朋友圈</span>
      </div>
      <div class="act">
        <div class="ic save"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fbf8f3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v11"/><path d="M8 11l4 4 4-4"/><path d="M5 19h14"/></svg></div>
        <span class="lab">保存图片</span>
      </div>
      <div class="act">
        <div class="ic link"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3a2e23" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 14.5l5-5"/><path d="M13 7l1.2-1.2a3.5 3.5 0 015 5L18 12"/><path d="M11 17l-1.2 1.2a3.5 3.5 0 01-5-5L6 12"/></svg></div>
        <span class="lab">复制链接</span>
      </div>
    </div>
    <button class="cancelbtn">取消</button>
  </div>
</div>
</body>
</html>
