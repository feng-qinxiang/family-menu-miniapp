<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>家庭点菜 · 微信支付</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-font-smoothing:antialiased; }
  :root{
    --paper:#fbf8f3; --paper-2:#f0ebe2;
    --ink:#2c241b; --ink-deep:#3a2e23;
    --mut:#9a8e7d; --mut-2:#b3a795; --mut-strong:#7a6e5d;
    --gold:#f4d9a8; --gold-deep:#b08949;
    --pop:#e8472a; --pop-soft:#fdece6;
    --wx:#07c160; --wx-deep:#06a050;
    --serif:"Georgia","Times New Roman",serif;
    --line:#ededed;
  }
  body {
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; background:#d9d2c7;
    font-family:-apple-system,"SF Pro Text","Helvetica Neue",Helvetica,Arial,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  }
  .phone {
    position:relative; width:390px; height:844px;
    background:#fff; border-radius:46px;
    box-shadow:0 30px 70px rgba(60,45,30,.4), 0 0 0 11px #1b1714, 0 0 0 12px #2c2520;
    overflow:hidden;
  }
  .notch { position:absolute; top:11px; left:50%; transform:translateX(-50%); width:118px; height:33px; background:#1b1714; border-radius:20px; z-index:61; }
  .status {
    position:absolute; top:0; left:0; right:0; height:50px; z-index:60;
    display:flex; align-items:center; justify-content:space-between;
    padding:0 30px 0 34px; color:#0c0c0c; font-size:15px; font-weight:600; pointer-events:none;
  }
  .status .right { display:flex; align-items:center; gap:7px; }
  .tapscale { transition:transform .12s ease; }
  .tapscale:active { transform:scale(.97); }

  .scroll { position:absolute; inset:0; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch; background:#fff; }
  .scroll::-webkit-scrollbar { display:none; }

  /* wechat nav */
  .wxnav { position:relative; height:50px; margin-top:50px; display:flex; align-items:center; justify-content:center; }
  .wxnav .back { position:absolute; left:14px; width:34px; height:34px; display:flex; align-items:center; justify-content:center; }
  .wxnav .ttl { font-size:17px; font-weight:600; color:#0c0c0c; letter-spacing:.3px; }
  .wxnav .more { position:absolute; right:16px; display:flex; gap:4px; }
  .wxnav .more i { width:5px; height:5px; border-radius:50%; background:#0c0c0c; display:block; }

  /* merchant block */
  .merchant { text-align:center; padding:26px 0 22px; }
  .merchant .mlogo { width:60px; height:60px; border-radius:16px; background:var(--wx); margin:0 auto 12px;
    display:flex; align-items:center; justify-content:center; box-shadow:0 8px 20px rgba(7,193,96,.32); }
  .merchant .mname { font-size:16px; font-weight:600; color:#1a1a1a; letter-spacing:.2px; }
  .merchant .border-sub { font-size:13px; color:#9b9b9b; margin-top:5px; }

  /* amount */
  .amount { text-align:center; padding:6px 0 30px; }
  .amount .sym { font-size:30px; font-weight:600; color:#1a1a1a; vertical-align:14px; margin-right:2px; }
  .amount .big { font-size:62px; font-weight:600; color:#1a1a1a; letter-spacing:-2px; font-family:-apple-system,"Helvetica Neue",sans-serif; }

  /* detail rows */
  .rows { margin:0 20px; border-top:1px solid var(--line); }
  .row { display:flex; align-items:center; justify-content:space-between; padding:17px 4px; border-bottom:1px solid var(--line); }
  .row .lbl { font-size:15px; color:#1a1a1a; }
  .row .val { display:flex; align-items:center; gap:10px; font-size:15px; color:#1a1a1a; font-weight:500; }
  .row .val .sub { font-size:13px; color:#9b9b9b; font-weight:400; }
  .row .arrow { color:#c5c5c5; }

  /* pay method */
  .paymethod .pm-left { display:flex; align-items:center; gap:12px; }
  .pm-icon { width:30px; height:30px; border-radius:8px; background:var(--wx); display:flex; align-items:center; justify-content:center; flex:none; }
  .pm-name { font-size:15px; color:#1a1a1a; }
  .pm-bal { font-size:12px; color:#9b9b9b; margin-top:2px; }
  .pm-check { width:21px; height:21px; border-radius:50%; background:var(--wx); display:flex; align-items:center; justify-content:center; }

  /* discount tag */
  .disc { font-size:13px; color:var(--pop); font-weight:500; }

  /* pay button area */
  .payarea { margin:36px 20px 0; }
  .btn-pay { width:100%; background:var(--wx); color:#fff; border:none; border-radius:10px; padding:15px; font-size:17px; font-weight:600; letter-spacing:.5px;
    box-shadow:0 8px 22px rgba(7,193,96,.32); font-family:inherit; }
  .btn-pay:active { background:var(--wx-deep); }

  /* security hint */
  .seccard { margin:26px 20px 0; display:flex; align-items:center; justify-content:center; gap:8px; }
  .seccard svg { flex:none; }
  .seccard span { font-size:12.5px; color:#b5b5b5; }

  /* fingerprint hint */
  .biometric { margin:30px 20px 18px; text-align:center; }
  .biometric .ring { width:62px; height:62px; border-radius:50%; margin:0 auto 12px; border:1.5px solid #e6e6e6; display:flex; align-items:center; justify-content:center; }
  .biometric .bm-txt { font-size:13.5px; color:#9b9b9b; }
  .biometric .bm-alt { font-size:13.5px; color:var(--wx); font-weight:500; margin-top:14px; }

  .home-ind { position:absolute; bottom:9px; left:50%; transform:translateX(-50%); width:134px; height:5px; border-radius:3px; background:#1a1a1a; opacity:.85; z-index:55; }
</style>
</head>
<body>
<div class="phone">
  <div class="notch"></div>
  <div class="status">
    <span>9:41</span>
    <span class="right">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="none"><rect x="0" y="7" width="3" height="5" rx="1" fill="#0c0c0c"/><rect x="5" y="4.5" width="3" height="7.5" rx="1" fill="#0c0c0c"/><rect x="10" y="2" width="3" height="10" rx="1" fill="#0c0c0c"/><rect x="15" y="0" width="3" height="12" rx="1" fill="#0c0c0c" opacity=".35"/></svg>
      <svg width="17" height="12" viewBox="0 0 17 12" fill="none"><path d="M8.5 2.5C11 2.5 13.2 3.5 14.8 5.1L8.5 11.4 2.2 5.1C3.8 3.5 6 2.5 8.5 2.5Z" fill="#0c0c0c"/></svg>
      <svg width="26" height="13" viewBox="0 0 26 13" fill="none"><rect x="1" y="1" width="21" height="11" rx="3" stroke="#0c0c0c" stroke-width="1.2" opacity=".4"/><rect x="3" y="3" width="16" height="7" rx="1.5" fill="#0c0c0c"/><rect x="23.5" y="4.5" width="2" height="4" rx="1" fill="#0c0c0c" opacity=".5"/></svg>
    </span>
  </div>

  <div class="scroll">
    <div class="wxnav">
      <div class="back tapscale">
        <svg width="12" height="20" viewBox="0 0 12 20" fill="none" stroke="#0c0c0c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2L2 10l8 8"/></svg>
      </div>
      <div class="ttl">微信支付</div>
      <div class="more"><i></i><i></i><i></i></div>
    </div>

    <div class="merchant">
      <div class="mlogo">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5L12 4l8 6.5"/><path d="M6 9.5V20h12V9.5"/><path d="M10 20v-4h4v4"/></svg>
      </div>
      <div class="mname">家庭点菜</div>
      <div class="border-sub">家庭云同步年卡</div>
    </div>

    <div class="amount">
      <span class="sym">¥</span><span class="big">66.00</span>
    </div>

    <div class="rows">
      <div class="row">
        <span class="lbl">商品</span>
        <span class="val">家庭云同步年卡 <svg class="arrow" width="8" height="14" viewBox="0 0 8 14" fill="none" stroke="#c5c5c5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M1 1l6 6-6 6"/></svg></span>
      </div>
      <div class="row paymethod tapscale">
        <div class="pm-left">
          <div class="pm-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="#fff"><path d="M9.2 3C5 3 1.6 5.9 1.6 9.5c0 2 1.1 3.8 2.9 5l-.7 2.2 2.6-1.3c.9.2 1.8.4 2.8.4h.5a5.6 5.6 0 01-.3-1.8c0-3.4 3.2-6.1 7.1-6.1h.5C16.8 5.2 13.4 3 9.2 3zM6.6 8.2a1 1 0 110-2 1 1 0 010 2zm5.2 0a1 1 0 110-2 1 1 0 010 2z"/><path d="M22.4 14c0-2.9-2.8-5.2-6.2-5.2S10 11.1 10 14s2.8 5.2 6.2 5.2c.7 0 1.4-.1 2.1-.3l1.9 1-.5-1.7c1.6-1 2.7-2.5 2.7-4.2zm-8.2-.9a.8.8 0 110-1.6.8.8 0 010 1.6zm4 0a.8.8 0 110-1.6.8.8 0 010 1.6z"/></svg>
          </div>
          <div>
            <div class="pm-name">零钱</div>
            <div class="pm-bal">余额 ¥326.50</div>
          </div>
        </div>
        <div class="pm-check">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
        </div>
      </div>
      <div class="row tapscale">
        <span class="lbl">银行卡</span>
        <span class="val"><span class="sub">招商银行(8866) 等 2 张</span><svg class="arrow" width="8" height="14" viewBox="0 0 8 14" fill="none" stroke="#c5c5c5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M1 1l6 6-6 6"/></svg></span>
      </div>
      <div class="row tapscale">
        <span class="lbl">优惠</span>
        <span class="val"><span class="disc">新人立减 ¥2.00</span><svg class="arrow" width="8" height="14" viewBox="0 0 8 14" fill="none" stroke="#c5c5c5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M1 1l6 6-6 6"/></svg></span>
      </div>
      <div class="row">
        <span class="lbl">实付</span>
        <span class="val"><span style="color:#1a1a1a;font-weight:700;">¥66.00</span> <span class="sub" style="text-decoration:line-through;margin-left:6px;">¥68.00</span></span>
      </div>
    </div>

    <div class="seccard">
      <svg width="14" height="16" viewBox="0 0 24 24" fill="none" stroke="#b5b5b5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l8 3v6c0 5-3.4 8.5-8 11-4.6-2.5-8-6-8-11V5l8-3z"/></svg>
      <span>财付通提供资金安全保障 · 资金受保护</span>
    </div>

    <div class="biometric">
      <div class="ring tapscale">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#07c160" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 4.5c-3.5 0-6 2.3-6 5.5v3c0 1.3-.3 2.6-.8 3.7"/>
          <path d="M12 8c-1.5 0-2.5 1-2.5 2.5V13c0 1.8-.4 3.5-1.2 5"/>
          <path d="M12 11.5v1.5c0 2.2-.5 4.3-1.5 6"/>
          <path d="M18 10c0-3.2-2.5-5.5-6-5.5"/>
          <path d="M18 13.5c0 1.8-.3 3.6-.9 5.3"/>
          <path d="M14.5 11v2c0 2.6-.6 5.1-1.7 7.3"/>
        </svg>
      </div>
      <div class="bm-txt">请验证指纹以支付 ¥66.00</div>
      <div class="bm-alt tapscale">使用密码支付</div>
    </div>

    <div style="height:24px"></div>
  </div>

  <div class="home-ind"></div>
</div>
</body>
</html>
