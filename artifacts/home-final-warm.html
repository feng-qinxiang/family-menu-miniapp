<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>家庭点菜 · 今日菜单当封面(暖化A版)</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-font-smoothing:antialiased; }
  :root{
    --paper:#fbf8f3; --paper-2:#f0ebe2;
    --ink:#2c241b; --ink-deep:#3a2e23;
    --mut:#9a8e7d; --mut-2:#b3a795; --mut-strong:#7a6e5d;
    --gold:#f4d9a8; --gold-deep:#b08949;
    --pop:#e8472a; --pop-soft:#fdece6;
    --pine:#2f4a3a;
    --sage:#7e9a6b;         /* 由墨绿 pine 提亮的柔和"够"色,非糖果薄荷 */
    --sage-on-dark:#bcd0a6;
    --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    --serif:"Georgia","Times New Roman",serif;
  }
  body { display:flex; align-items:center; justify-content:center; min-height:100vh; background:#d9d2c7;
    font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif; }
  .phone { position:relative; width:390px; height:844px; background:var(--paper); border-radius:46px;
    box-shadow:0 30px 70px rgba(60,45,30,.4), 0 0 0 11px #1b1714, 0 0 0 12px #2c2520; overflow:hidden; }
  .status { position:absolute; top:0; left:0; right:0; height:50px; z-index:60; display:flex; align-items:center;
    justify-content:space-between; padding:0 30px 0 34px; color:var(--ink); font-size:15px; font-weight:600; pointer-events:none; }
  .status .right { display:flex; align-items:center; gap:7px; }
  .notch { position:absolute; top:11px; left:50%; transform:translateX(-50%); width:118px; height:33px; background:#1b1714; border-radius:20px; z-index:61; }
  .scroll { position:absolute; inset:0; overflow-y:auto; overflow-x:hidden; }
  .scroll::-webkit-scrollbar { display:none; }
  .wrap { padding:62px 20px 120px; }

  /* 顶部问候 */
  .top { display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:16px; }
  .top .hi { font-size:14px; color:var(--mut-strong); font-weight:600; }
  .top .q { font-size:24px; font-weight:900; color:var(--ink); margin-top:3px; letter-spacing:-.5px; }
  .top .q .pop { color:var(--pop); }
  .top .date { font-family:var(--serif); font-style:italic; font-size:12.5px; color:var(--gold-deep); font-weight:700; margin-top:5px; }
  .iconbtn { width:42px; height:42px; border-radius:50%; background:#fff; box-shadow:0 2px 8px rgba(60,40,20,.1);
    display:flex; align-items:center; justify-content:center; position:relative; flex:none; }
  .bell-dot { position:absolute; top:9px; right:10px; width:9px; height:9px; border-radius:50%; background:var(--pop); border:1.5px solid #fff; }

  /* 家庭动态 */
  .feed { background:var(--pop-soft); border-radius:16px; padding:10px 14px; display:flex; align-items:center; gap:10px; margin-bottom:18px; }
  .feed .av { width:30px; height:30px; border-radius:50%; flex:none; background:var(--pop);
    display:flex; align-items:center; justify-content:center; color:#fff; font-size:13px; font-weight:800; }
  .feed .t { font-size:12.5px; color:#a23c20; line-height:1.4; } .feed .t b { font-weight:800; }
  .feed .tm { margin-left:auto; font-size:11px; color:#c08a72; flex:none; }

  /* ★ 今日菜单 = 封面主角 */
  .today { background:var(--ink-deep); border-radius:28px; padding:22px 20px 18px; color:var(--paper); position:relative; overflow:hidden; }
  .today::after { content:""; position:absolute; right:-40px; top:-40px; width:170px; height:170px; border-radius:50%; background:rgba(232,71,42,.16); }
  .today-head { display:flex; align-items:flex-end; justify-content:space-between; position:relative; z-index:2; }
  .today-head .eb { font-family:var(--serif); font-style:italic; font-size:12.5px; color:var(--gold); font-weight:700; letter-spacing:.5px; }
  .today-head h2 { font-size:27px; font-weight:900; margin-top:4px; letter-spacing:-.5px; }
  .today-head .cnt { font-size:12px; color:rgba(255,255,255,.6); font-weight:600; padding-bottom:4px; }
  .tdish { display:flex; align-items:flex-start; gap:12px; margin-top:15px; padding:12px; background:rgba(255,255,255,.07); border-radius:17px; position:relative; z-index:2; }
  .tdish .pic { width:54px; height:54px; border-radius:14px; flex:none; background-size:cover; background-position:center; }
  .tdish .mid { flex:1; min-width:0; }
  .tdish .nm { font-size:16px; font-weight:800; }
  .tdish .who { font-size:11.5px; color:var(--gold); margin-top:3px; font-weight:600; }
  .tdish .tags { display:flex; gap:6px; margin-top:7px; flex-wrap:wrap; }
  .tdish .tags .c { font-size:10.5px; padding:3px 9px; border-radius:999px; font-weight:700; }
  .tdish .tags .ok { background:rgba(126,154,107,.22); color:var(--sage-on-dark); }
  .tdish .tags .miss { background:rgba(232,71,42,.26); color:#ffb3a0; }
  .tdish .x { color:rgba(255,255,255,.35); font-size:20px; flex:none; }
  .today-bot { display:flex; align-items:center; justify-content:space-between; margin-top:16px; padding-top:15px; border-top:1px solid rgba(255,255,255,.13); position:relative; z-index:2; }
  .today-bot .buy-tip { font-size:13px; color:rgba(255,255,255,.8); font-weight:600; }
  .today-bot .buy-tip b { color:var(--gold); font-weight:900; font-size:16px; }
  .today-bot .gobtn { background:var(--pop); color:#fff; font-size:13.5px; font-weight:800; padding:11px 18px; border-radius:30px; display:flex; align-items:center; gap:6px; box-shadow:0 8px 18px rgba(232,71,42,.35); }

  /* 双行动按钮 */
  .acts { display:flex; gap:12px; margin-top:14px; }
  .acts .a { flex:1; border-radius:18px; padding:15px 14px; display:flex; align-items:center; gap:11px; font-weight:800; font-size:14.5px; }
  .acts .a.main { background:var(--pop); color:#fff; box-shadow:0 10px 22px rgba(232,71,42,.3); }
  .acts .a.sub { background:#fff; color:var(--ink); box-shadow:0 2px 8px rgba(60,40,20,.08); }
  .acts .a .ic { flex:none; display:flex; align-items:center; justify-content:center; }
  .acts .a .sm { font-size:11px; font-weight:600; color:var(--mut); margin-top:1px; }

  /* 次要:家里常做的菜 */
  .shead { display:flex; align-items:flex-end; justify-content:space-between; margin:30px 0 14px; }
  .shead > div:first-child { position:relative; padding-left:14px; }
  .shead > div:first-child::before { content:""; position:absolute; left:0; top:3px; bottom:3px; width:4px; border-radius:3px; background:var(--pop); }
  .shead .eyebrow { font-family:var(--serif); font-style:italic; font-size:12.5px; letter-spacing:1px; color:var(--gold-deep); font-weight:700; }
  .shead h2 { font-size:24px; font-weight:900; color:var(--ink); letter-spacing:-.5px; margin-top:4px; line-height:1; }
  .shead h2 .pop { color:var(--pop); }
  .seeall { font-size:13px; color:var(--gold-deep); font-weight:700; flex:none; padding-bottom:3px; }
  .hcards { display:flex; gap:14px; overflow-x:auto; padding-bottom:4px; }
  .hcards::-webkit-scrollbar { display:none; }
  .rcard { flex:none; width:160px; background:#fff; border-radius:20px; overflow:hidden; box-shadow:0 2px 6px rgba(60,40,20,.06), 0 14px 32px rgba(120,70,30,.12); border:1px solid #f1ece2; }
  .rcard .ph { height:110px; background-size:cover; background-position:center; position:relative; }
  .rcard .lbl { position:absolute; top:9px; left:9px; font-size:10.5px; font-weight:800; color:#fff; background:rgba(40,30,20,.55); backdrop-filter:blur(4px); padding:3px 9px; border-radius:999px; }
  .rcard .info { padding:11px 13px 13px; }
  .rcard .info h3 { font-size:15.5px; font-weight:800; color:var(--ink); }
  .rcard .info .meta { font-size:11.5px; color:#7d7160; margin-top:6px; }

  .tabbar { position:absolute; bottom:0; left:0; right:0; height:88px; z-index:50; background:rgba(251,248,243,.92); backdrop-filter:blur(18px); border-top:1px solid #ece5d9; display:flex; justify-content:space-around; align-items:flex-start; padding-top:13px; }
  .tab { display:flex; flex-direction:column; align-items:center; gap:5px; color:#857a68; font-size:10.5px; font-weight:600; }
  .tab.on { color:var(--pop); }
  .home-ind { position:absolute; bottom:9px; left:50%; transform:translateX(-50%); width:134px; height:5px; border-radius:3px; background:#2c241b; opacity:.85; z-index:55; }
</style>
</head>
<body>
<div class="phone">
  <div class="notch"></div>
  <div class="status">
    <span>9:41</span>
    <span class="right">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="none"><rect x="0" y="7" width="3" height="5" rx="1" fill="#2c241b"/><rect x="5" y="4.5" width="3" height="7.5" rx="1" fill="#2c241b"/><rect x="10" y="2" width="3" height="10" rx="1" fill="#2c241b"/><rect x="15" y="0" width="3" height="12" rx="1" fill="#2c241b" opacity=".4"/></svg>
      <svg width="26" height="13" viewBox="0 0 26 13" fill="none"><rect x="1" y="1" width="21" height="11" rx="3" stroke="#2c241b" stroke-width="1.2" opacity=".5"/><rect x="3" y="3" width="16" height="7" rx="1.5" fill="#2c241b"/></svg>
    </span>
  </div>

  <div class="scroll">
    <div class="wrap">

      <div class="top">
        <div>
          <div class="hi">晚上好,这一家子</div>
          <div class="q">今晚<span class="pop">吃点啥</span>?</div>
          <div class="date">6月20日 周五 · 晚餐</div>
        </div>
        <div class="iconbtn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2c241b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg><span class="bell-dot"></span></div>
      </div>

      <div class="feed">
        <div class="av">明</div>
        <div class="t"><b>小明</b> 把「番茄炒蛋」加进了今晚</div>
        <div class="tm">刚刚</div>
      </div>

      <!-- ★ 今日菜单 = 第一屏主角 -->
      <div class="today">
        <div class="today-head">
          <div>
            <div class="eb">今天这一桌</div>
            <h2>今日菜单</h2>
          </div>
          <div class="cnt">全家都能点</div>
        </div>

        <div class="tdish">
          <div class="pic" style="background-image:url('img/mapo-tofu.jpg')"></div>
          <div class="mid">
            <div class="nm">麻婆豆腐</div>
            <div class="who">妈妈点的 · 17:50</div>
            <div class="tags"><span class="c ok">✓ 豆腐够</span><span class="c ok">✓ 肉末够</span><span class="c miss">缺豆瓣酱</span></div>
          </div>
          <div class="x">×</div>
        </div>

        <div class="tdish">
          <div class="pic" style="background-image:url('img/tomato-egg.jpg')"></div>
          <div class="mid">
            <div class="nm">番茄炒蛋</div>
            <div class="who">小明点的 · 刚刚</div>
            <div class="tags"><span class="c ok">✓ 鸡蛋够</span><span class="c ok">✓ 番茄够</span></div>
          </div>
          <div class="x">×</div>
        </div>

        <div class="tdish">
          <div class="pic" style="background-image:url('img/egg-drop-soup.jpg')"></div>
          <div class="mid">
            <div class="nm">蛋花汤</div>
            <div class="who">爸爸点的 · 18:05</div>
            <div class="tags"><span class="c ok">✓ 鸡蛋够</span><span class="c miss">缺小葱</span></div>
          </div>
          <div class="x">×</div>
        </div>

        <div class="today-bot">
          <div class="buy-tip">还要买 <b>3</b> 样</div>
          <div class="gobtn">去买菜 <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg></div>
        </div>
      </div>

      <div class="acts">
        <div class="a main"><span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3v8a3 3 0 0 0 6 0V3"/><path d="M8 3v18"/><path d="M17 3c-1.5 1.5-2 4-2 6s.5 3 2 3v9"/></svg></span>去点菜</div>
        <div class="a sub"><span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2c241b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 3v9l6 4"/></svg></span><div>转一个<div class="sm">看冰箱能做啥</div></div></div>
      </div>

      <!-- 次要:家里常做的菜 -->
      <div class="shead">
        <div>
          <div class="eyebrow">家的味道</div>
          <h2>家里<span class="pop">常做</span>的</h2>
        </div>
        <span class="seeall">全部 ›</span>
      </div>
      <div class="hcards">
        <div class="rcard"><div class="ph" style="background-image:url('img/hongshao-pork.jpg')"><span class="lbl">家常</span></div><div class="info"><h3>红烧肉</h3><div class="meta">做过 6 次 · 50 分钟</div></div></div>
        <div class="rcard"><div class="ph" style="background-image:url('img/kungpao-chicken.jpg')"><span class="lbl">川菜</span></div><div class="info"><h3>宫保鸡丁</h3><div class="meta">微辣 · 25 分钟</div></div></div>
        <div class="rcard"><div class="ph" style="background-image:url('img/long-beans.jpg')"><span class="lbl">家常</span></div><div class="info"><h3>蒜蓉空心菜</h3><div class="meta">奶奶爱吃 · 10 分钟</div></div></div>
      </div>

    </div>
  </div>

  <div class="tabbar">
    <div class="tab on"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5L12 4l8 6.5"/><path d="M6 9.5V20h12V9.5"/></svg>今日</div>
    <div class="tab"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h11a2 2 0 012 2v14l-7-3-6 3V4z"/></svg>菜谱</div>
    <div class="tab"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2.5"/><path d="M5 11h14"/><path d="M9 6.5v1.5M9 14v1.5"/></svg>冰箱</div>
    <div class="tab"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.6"/><path d="M5 20c0-3.6 3.1-6 7-6s7 2.4 7 6"/></svg>我的</div>
  </div>
  <div class="home-ind"></div>
</div>
</body>
</html>
