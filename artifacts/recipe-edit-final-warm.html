<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新建菜谱 · 精致撞色</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-font-smoothing:antialiased; }
  :root{
    --paper:#fbf8f3; --paper-2:#f0ebe2; --ink:#2c241b; --ink-deep:#3a2e23;
    --mut:#9a8e7d; --mut-2:#b3a795; --gold:#f4d9a8; --gold-deep:#b08949;
    --pop:#e8472a; --pop-soft:#fdece6; --pine:#2f4a3a; --serif:"Georgia","Times New Roman",serif;
  }
  body { display:flex; align-items:center; justify-content:center; min-height:100vh; background:#d9d2c7;
    font-family:-apple-system,"SF Pro Text","Helvetica Neue",Helvetica,Arial,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif; }
  .phone { position:relative; width:390px; height:844px; background:var(--paper); border-radius:46px;
    box-shadow:0 30px 70px rgba(60,45,30,.4), 0 0 0 11px #1b1714, 0 0 0 12px #2c2520; overflow:hidden; }
  .status { position:absolute; top:0; left:0; right:0; height:50px; z-index:60; display:flex; align-items:center; justify-content:space-between; padding:0 30px 0 34px; color:var(--ink); font-size:15px; font-weight:600; pointer-events:none; }
  .status .right { display:flex; align-items:center; gap:7px; }
  .notch { position:absolute; top:11px; left:50%; transform:translateX(-50%); width:118px; height:33px; background:#1b1714; border-radius:20px; z-index:61; }
  .scroll { position:absolute; inset:0; overflow-y:auto; overflow-x:hidden; }
  .scroll::-webkit-scrollbar { display:none; }
  .navbtn:active, .chip:active, .addrow:active, .savebtn:active, .stepper b:active { transform:scale(.97); }

  .nav { position:relative; z-index:10; display:flex; align-items:center; justify-content:space-between; padding:62px 24px 18px; }
  .navbtn { width:42px; height:42px; border-radius:50%; background:var(--paper-2); border:1px solid #ece5d9; display:flex; align-items:center; justify-content:center; color:var(--ink-deep); }
  .nav .title { font-family:var(--serif); font-style:italic; font-size:13px; letter-spacing:1px; color:var(--gold-deep); font-weight:700; }
  .save { font-size:14px; font-weight:800; color:var(--pop); width:42px; text-align:right; }

  .body { padding:6px 24px 120px; }
  .h1 { font-size:34px; font-weight:900; color:var(--ink); letter-spacing:-1.5px; line-height:.96; }
  .h1 .pop { color:var(--pop); }
  .tip { display:flex; align-items:center; gap:8px; margin-top:14px; background:var(--pop-soft); border-radius:12px; padding:11px 14px; font-size:12.5px; color:#b8442a; font-weight:600; }

  .cover { margin-top:22px; height:170px; border-radius:20px; border:2px dashed #d8cbb8; background:var(--paper-2); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; color:var(--mut); }
  .cover .ic { width:40px; height:40px; border-radius:50%; background:#fff; display:flex; align-items:center; justify-content:center; box-shadow:0 4px 10px rgba(120,70,30,.1); }
  .cover .t { font-size:14px; font-weight:600; }
  .cover .s { font-size:11.5px; color:#8f8472; }

  .sec { margin-top:30px; }
  .eyebrow { font-family:var(--serif); font-style:italic; font-size:12px; letter-spacing:1px; color:var(--gold-deep); font-weight:700; position:relative; padding-left:13px; }
  .eyebrow::before { content:""; position:absolute; left:0; top:1px; bottom:1px; width:4px; border-radius:3px; background:var(--pop); }
  .sec h2 { font-size:21px; font-weight:900; color:var(--ink); letter-spacing:-.6px; margin-top:8px; }

  .field { margin-top:14px; }
  .label { font-size:12.5px; color:#7a6e5d; font-weight:600; margin-bottom:7px; }
  .input { width:100%; background:#fff; border:1px solid #ece5d9; border-radius:14px; padding:14px 15px; font-size:16px; color:var(--ink); font-weight:600; box-shadow:0 2px 6px rgba(60,40,20,.04); }

  .chips { display:flex; gap:9px; flex-wrap:wrap; }
  .chip { font-size:13px; font-weight:600; color:var(--mut); padding:11px 16px; border-radius:30px; background:var(--paper-2); border:1px solid transparent; }
  .chip.on { background:var(--ink-deep); color:var(--paper); border-color:var(--ink-deep); }

  .duo { display:flex; gap:13px; }
  .duo > .field { flex:1; margin-top:0; }
  .stepper { display:flex; align-items:center; justify-content:space-between; background:#fff; border:1px solid #ece5d9; border-radius:14px; padding:6px 10px; }
  .stepper b { width:38px; height:38px; border-radius:10px; background:var(--paper-2); display:flex; align-items:center; justify-content:center; font-size:20px; color:var(--ink-deep); font-weight:400; }
  .stepper .v { font-size:16px; font-weight:800; color:var(--ink); }

  .listrow { display:flex; align-items:center; gap:10px; background:#fff; border:1px solid #ece5d9; border-radius:14px; padding:11px 13px; margin-bottom:9px; box-shadow:0 2px 6px rgba(60,40,20,.04); }
  .listrow .nm { flex:1; font-size:15px; font-weight:600; color:var(--ink); }
  .listrow .amt { font-size:13px; color:#7a6e5d; font-weight:600; }
  .listrow .del { width:36px; height:36px; border-radius:50%; background:var(--pop-soft); color:var(--pop); display:flex; align-items:center; justify-content:center; flex:none; }
  .stepnum { width:24px; height:24px; border-radius:7px; background:var(--pop); color:#fff; font-size:12px; font-weight:800; display:flex; align-items:center; justify-content:center; flex:none; }
  .steptext { flex:1; font-size:14px; color:var(--ink); line-height:1.4; font-weight:500; }
  .addrow { display:flex; align-items:center; justify-content:center; gap:7px; border:1.5px dashed #d8cbb8; border-radius:14px; padding:13px; font-size:14px; font-weight:700; color:var(--gold-deep); }

  .footbar { position:absolute; bottom:0; left:0; right:0; padding:16px 24px 30px; background:linear-gradient(180deg, rgba(251,248,243,0), var(--paper) 30%); }
  .savebtn { width:100%; height:54px; border-radius:16px; background:var(--pop); color:#fff; font-size:16px; font-weight:800; display:flex; align-items:center; justify-content:center; gap:8px; box-shadow:0 8px 22px rgba(232,71,42,.4); }
</style>
</head>
<body>
<div class="phone">
  <div class="notch"></div>
  <div class="status">
    <span>9:41</span>
    <span class="right">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="none"><rect x="0" y="7" width="3" height="5" rx="1" fill="#2c241b"/><rect x="5" y="4.5" width="3" height="7.5" rx="1" fill="#2c241b"/><rect x="10" y="2" width="3" height="10" rx="1" fill="#2c241b"/><rect x="15" y="0" width="3" height="12" rx="1" fill="#2c241b" opacity=".4"/></svg>
      <svg width="26" height="13" viewBox="0 0 26 13" fill="none"><rect x="1" y="1" width="21" height="11" rx="3" stroke="#2c241b" stroke-width="1.2" opacity=".5"/><rect x="3" y="3" width="16" height="7" rx="1.5" fill="#2c241b"/><rect x="23.5" y="4.5" width="2" height="4" rx="1" fill="#2c241b" opacity=".6"/></svg>
    </span>
  </div>
  <div class="scroll">
    <div class="nav">
      <div class="navbtn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></div>
      <span class="title">记一道菜</span>
      <span class="save">保存</span>
    </div>
    <div class="body">
      <div class="h1">记一道<span class="pop">菜</span></div>
      <div class="tip">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#e8472a" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.01"/></svg>
        再填 2 个食材，这道菜就完整啦
      </div>
      <div class="cover">
        <div class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#b08949" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5a2 2 0 012-2h2l1.5-2h7L20 6.5h-1a2 2 0 012 2V18a2 2 0 01-2 2H5a2 2 0 01-2-2V8.5z"/><circle cx="12" cy="13" r="3.5"/></svg></div>
        <div class="t">拍张菜的照片</div>
        <div class="s">好看的封面，全家都想点</div>
      </div>
      <div class="sec">
        <div class="eyebrow">先填基本的</div>
        <h2>基本信息</h2>
        <div class="field"><div class="label">菜名</div><div class="input">红烧肉</div></div>
        <div class="field"><div class="label">菜系</div>
          <div class="chips"><div class="chip on">家常</div><div class="chip">川菜</div><div class="chip">粤菜</div><div class="chip">湘菜</div><div class="chip">面点</div></div>
        </div>
        <div class="duo" style="margin-top:14px;">
          <div class="field" style="margin-top:0;"><div class="label">耗时（分钟）</div><div class="stepper"><b>−</b><span class="v">50</span><b>+</b></div></div>
          <div class="field" style="margin-top:0;"><div class="label">几人份</div><div class="stepper"><b>−</b><span class="v">4</span><b>+</b></div></div>
        </div>
        <div class="field"><div class="label">常用标签</div>
          <div class="chips"><div class="chip on">下饭</div><div class="chip">硬菜</div><div class="chip on">孩子爱吃</div><div class="chip">宴客</div><div class="chip">快手</div></div>
        </div>
      </div>
      <div class="sec">
        <div class="eyebrow">要买啥</div>
        <h2>用到的食材</h2>
        <div style="margin-top:14px;">
          <div class="listrow"><span class="nm">五花肉</span><span class="amt">500 g</span><span class="del"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></span></div>
          <div class="listrow"><span class="nm">冰糖</span><span class="amt">30 g</span><span class="del"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></span></div>
          <div class="listrow"><span class="nm">生抽 / 老抽</span><span class="amt">适量</span><span class="del"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></span></div>
          <div class="addrow"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>添加食材</div>
        </div>
      </div>
      <div class="sec">
        <div class="eyebrow">怎么做</div>
        <h2>做法步骤</h2>
        <div style="margin-top:14px;">
          <div class="listrow"><span class="stepnum">1</span><span class="steptext">五花肉切麻将块，冷水下锅焯去血沫，捞出沥干。</span><span class="del"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></span></div>
          <div class="listrow"><span class="stepnum">2</span><span class="steptext">冷锅下冰糖小火炒出枣红糖色，下肉块翻匀上色。</span><span class="del"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></span></div>
          <div class="addrow"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>添加步骤</div>
        </div>
      </div>
    </div>
  </div>
  <div class="footbar">
    <div class="savebtn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>保存到我的菜谱</div>
  </div>
</div>
</body>
</html>
