<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>家庭点菜 · 重置密码</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-font-smoothing:antialiased; }
  :root{
    --paper:#fbf8f3; --paper-2:#f0ebe2;
    --ink:#2c241b; --ink-deep:#3a2e23;
    --mut:#9a8e7d; --mut-2:#b3a795; --mut-strong:#7a6e5d;
    --gold:#f4d9a8; --gold-deep:#b08949;
    --pop:#e8472a; --pop-soft:#fdece6;
    --serif:"Georgia","Times New Roman",serif;
  }
  body {
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; background:#d9d2c7;
    font-family:-apple-system,"SF Pro Text","Helvetica Neue",Helvetica,Arial,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  }
  .phone {
    position:relative; width:390px; height:844px;
    background:var(--paper); border-radius:46px;
    box-shadow:0 30px 70px rgba(60,45,30,.4), 0 0 0 11px #1b1714, 0 0 0 12px #2c2520;
    overflow:hidden;
  }
  .status {
    position:absolute; top:0; left:0; right:0; height:50px; z-index:60;
    display:flex; align-items:center; justify-content:space-between;
    padding:0 30px 0 34px; color:var(--ink); font-size:15px; font-weight:600; pointer-events:none;
  }
  .status .right { display:flex; align-items:center; gap:7px; }
  .notch { position:absolute; top:11px; left:50%; transform:translateX(-50%); width:118px; height:33px; background:#1b1714; border-radius:20px; z-index:61; }
  .scroll { position:absolute; inset:0; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch; }
  .scroll::-webkit-scrollbar { display:none; }
  .tapscale { transition:transform .12s ease; }
  .tapscale:active { transform:scale(.97); }

  /* nav */
  .nav { position:relative; padding:62px 24px 0; display:flex; align-items:center; }
  .backbtn { width:44px; height:44px; border-radius:50%; background:var(--ink-deep); display:flex; align-items:center; justify-content:center;
    box-shadow:0 8px 18px rgba(60,40,20,.22); flex:none; }
  .navttl { font-size:14px; font-weight:700; color:var(--mut-strong); margin-left:14px; letter-spacing:.3px; }

  /* head */
  .head { padding:30px 26px 6px; }
  .eyebrow { font-family:var(--serif); font-style:italic; font-size:13px; letter-spacing:1.5px; color:var(--gold-deep); font-weight:700; }
  .pagetitle { font-size:50px; line-height:.92; font-weight:900; letter-spacing:-2.5px; color:var(--ink); margin-top:8px;
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif; }
  .pagetitle .pop { color:var(--pop); }
  .sub { font-size:13.5px; color:var(--mut-strong); margin-top:14px; line-height:1.55; max-width:300px; }

  /* form */
  .form { padding:26px 24px 30px; }
  .field { position:relative; margin-bottom:18px; }
  .field label { display:block; font-size:11px; letter-spacing:1px; font-weight:800; text-transform:uppercase; color:var(--gold-deep); margin-bottom:8px; }
  .field .inp { display:flex; align-items:center; gap:11px; background:#fff; border:1.5px solid #ece4d6; border-radius:14px; padding:14px 16px;
    box-shadow:0 2px 6px rgba(60,40,20,.04); }
  .field .inp.focus { border-color:var(--pop); box-shadow:0 0 0 3px var(--pop-soft); }
  .field .inp svg { flex:none; }
  .field .inp .txt { flex:1; font-size:16px; font-weight:700; color:var(--ink); }
  .field .inp .ph { color:var(--mut-2); font-weight:600; }
  .field .inp .cur { width:2px; height:20px; background:var(--pop); border-radius:1px; margin-left:-4px; }
  .field .inp .eye { flex:none; }

  /* code field */
  .codefield .inp { gap:12px; }
  .codefield .txt { letter-spacing:6px; font-size:18px; font-weight:800; }
  .sendcode { flex:none; font-size:13px; font-weight:800; color:var(--pop); white-space:nowrap; padding:7px 13px; border-radius:10px; background:var(--pop-soft); }
  .sendcode.wait { color:var(--mut-strong); background:var(--paper-2); }

  .hint { font-size:11.5px; color:var(--mut-strong); margin-top:7px; padding-left:2px; display:flex; align-items:center; gap:6px; }
  .hint.ok { color:var(--gold-deep); }

  .resetbtn { width:100%; margin-top:10px; background:var(--pop); color:#fff; border:none; border-radius:16px; padding:17px; font-size:16.5px; font-weight:800;
    letter-spacing:.5px; display:flex; align-items:center; justify-content:center; gap:9px;
    box-shadow:0 2px 6px rgba(180,40,20,.3), 0 14px 30px rgba(232,71,42,.34); font-family:inherit; }

  .backlink { text-align:center; margin-top:22px; }
  .backlink a { font-size:14px; font-weight:700; color:var(--ink-deep); text-decoration:none; border-bottom:1px solid var(--mut-2); padding:7px 4px; }

  .home-ind { position:absolute; bottom:9px; left:50%; transform:translateX(-50%); width:134px; height:5px; border-radius:3px; background:#2c241b; opacity:.85; z-index:55; }
</style>
</head>
<body>
<div class="phone">
  <div class="notch"></div>
  <div class="status">
    <span>9:41</span>
    <span class="right">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="none"><rect x="0" y="7" width="3" height="5" rx="1" fill="#2c241b"/><rect x="5" y="4.5" width="3" height="7.5" rx="1" fill="#2c241b"/><rect x="10" y="2" width="3" height="10" rx="1" fill="#2c241b"/><rect x="15" y="0" width="3" height="12" rx="1" fill="#2c241b" opacity=".35"/></svg>
      <svg width="17" height="12" viewBox="0 0 17 12" fill="none"><path d="M8.5 2.5C11 2.5 13.2 3.5 14.8 5.1L8.5 11.4 2.2 5.1C3.8 3.5 6 2.5 8.5 2.5Z" fill="#2c241b"/></svg>
      <svg width="26" height="13" viewBox="0 0 26 13" fill="none"><rect x="1" y="1" width="21" height="11" rx="3" stroke="#2c241b" stroke-width="1.2" opacity=".5"/><rect x="3" y="3" width="16" height="7" rx="1.5" fill="#2c241b"/><rect x="23.5" y="4.5" width="2" height="4" rx="1" fill="#2c241b" opacity=".6"/></svg>
    </span>
  </div>

  <div class="scroll">
    <div class="nav">
      <div class="backbtn tapscale"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fbf8f3" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></div>
      <div class="navttl">返回登录</div>
    </div>

    <div class="head">
      <div class="eyebrow">找回密码</div>
      <div class="pagetitle">重置<span class="pop">密码</span></div>
      <div class="sub">输入注册时的手机号，我们会发送验证码帮你重新设置密码。</div>
    </div>

    <div class="form">
      <div class="field">
        <label>手机号</label>
        <div class="inp">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#b08949" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="3"/><path d="M11 18h2"/></svg>
          <span class="txt">138 8888 6666</span>
        </div>
      </div>

      <div class="field codefield">
        <label>验证码</label>
        <div class="inp focus">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#e8472a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h4l2 6 4-12 2 6h4"/></svg>
          <span class="txt">52<span class="ph" style="letter-spacing:6px">····</span></span>
          <span class="sendcode wait">56s 后重发</span>
        </div>
      </div>

      <div class="field">
        <label>新密码</label>
        <div class="inp">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#b08949" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 018 0v3"/></svg>
          <span class="txt">••••••••</span>
          <svg class="eye" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#9a8e7d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
        </div>
        <div class="hint">至少 8 位，含字母和数字</div>
      </div>

      <div class="field">
        <label>确认新密码</label>
        <div class="inp">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#b08949" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 018 0v3"/></svg>
          <span class="txt">••••••••</span>
          <svg class="eye" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#9a8e7d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
        </div>
        <div class="hint ok"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#b08949" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>两次密码一致</div>
      </div>

      <button class="resetbtn tapscale">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 11-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
        重置并登录
      </button>

      <div class="backlink"><a>想起密码了？返回登录</a></div>
    </div>
  </div>
  <div class="home-ind"></div>
</div>
</body>
</html>
