<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>编辑资料 · 家庭点菜</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-font-smoothing:antialiased; }
  :root{
    --paper:#fbf8f3; --paper-2:#f0ebe2;
    --ink:#2c241b; --ink-deep:#3a2e23;
    --mut:#9a8e7d; --mut-strong:#7a6e5d;
    --gold-deep:#b08949;
    --pop:#e8472a; --pop-soft:#fdece6;
    --serif:"Georgia","Times New Roman",serif;
  }
  body { display:flex; align-items:center; justify-content:center; min-height:100vh; background:#d9d2c7;
    font-family:-apple-system,"SF Pro Text","Helvetica Neue",Helvetica,Arial,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif; }
  .phone { position:relative; width:390px; height:844px; background:var(--paper); border-radius:46px;
    box-shadow:0 30px 70px rgba(60,45,30,.4), 0 0 0 11px #1b1714, 0 0 0 12px #2c2520; overflow:hidden; }
  .status { position:absolute; top:0; left:0; right:0; height:50px; z-index:60;
    display:flex; align-items:center; justify-content:space-between; padding:0 30px 0 34px; color:var(--ink); font-size:15px; font-weight:600; pointer-events:none; }
  .status .right { display:flex; align-items:center; gap:7px; }
  .notch { position:absolute; top:11px; left:50%; transform:translateX(-50%); width:118px; height:33px; background:#1b1714; border-radius:20px; z-index:61; }
  .scroll { position:absolute; inset:0; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch; }
  .scroll::-webkit-scrollbar { display:none; }

  .nav { position:relative; z-index:30; display:flex; align-items:center; justify-content:space-between; padding:62px 24px 8px; }
  .backbtn { width:42px; height:42px; border-radius:50%; background:var(--ink-deep); display:flex; align-items:center; justify-content:center; flex:none; }
  .nav h1 { font-size:21px; font-weight:900; color:var(--ink); letter-spacing:-.6px; font-family:"PingFang SC","Microsoft YaHei",sans-serif; }
  .nav h1 .pop { color:var(--pop); }
  .navsave { font-size:14px; font-weight:800; color:var(--gold-deep); letter-spacing:.3px; }

  .avatar-wrap { display:flex; flex-direction:column; align-items:center; margin:24px 0 14px; }
  .eyebrow { font-family:var(--serif); font-style:italic; font-size:12px; letter-spacing:1px; color:var(--gold-deep); font-weight:700; margin-bottom:14px; }
  .avatar { position:relative; width:108px; height:108px; }
  .avatar .ava-txt { width:108px; height:108px; border-radius:50%; background:var(--pop); border:3px solid #fff;
    display:flex; align-items:center; justify-content:center; color:#fff; font-size:46px; font-weight:900;
    font-family:"PingFang SC","Microsoft YaHei",sans-serif; letter-spacing:1px;
    box-shadow:0 2px 6px rgba(60,40,20,.06), 0 18px 40px rgba(120,70,30,.18); }
  .cam { position:absolute; right:-2px; bottom:-2px; width:38px; height:38px; border-radius:50%; background:var(--pop);
    display:flex; align-items:center; justify-content:center; border:3px solid var(--paper); box-shadow:0 6px 14px rgba(232,71,42,.4); }
  .avatar-hint { margin-top:13px; font-size:13px; font-weight:700; color:var(--mut-strong); }

  .group { margin:18px 24px 0; background:#fff; border-radius:22px; overflow:hidden;
    box-shadow:0 2px 6px rgba(60,40,20,.06), 0 18px 40px rgba(120,70,30,.14); border:1px solid #f1ece2; }
  .grlabel { padding:0 24px; margin:26px 0 9px; font-family:var(--serif); font-style:italic; font-size:12px; letter-spacing:.5px; color:var(--gold-deep); font-weight:700; }
  .frow { display:flex; align-items:center; gap:14px; padding:16px 18px; border-bottom:1px solid #f1ece2; }
  .frow:last-child { border-bottom:none; }
  .fic { width:38px; height:38px; border-radius:12px; background:var(--paper-2); display:flex; align-items:center; justify-content:center; flex:none; color:var(--gold-deep); }
  .flabel { font-size:15px; font-weight:700; color:var(--ink); flex:none; width:54px; }
  .fval { flex:1; text-align:right; font-size:15px; font-weight:600; color:var(--ink-deep); }
  .fval.ph { color:var(--mut); font-weight:500; }
  .chev { color:var(--mut); flex:none; }
  .pillrow { display:flex; gap:8px; }
  .pill { font-size:13px; font-weight:700; color:var(--mut-strong); padding:7px 15px; border-radius:30px; background:var(--paper-2); border:1px solid transparent; }
  .pill.on { background:var(--pop-soft); color:var(--pop); border-color:rgba(232,71,42,.3); }

  .savebar { padding:28px 24px 40px; }
  .savebtn { width:100%; height:54px; border:none; border-radius:18px; background:var(--pop); color:#fff; font-size:16px; font-weight:800; letter-spacing:.5px;
    display:flex; align-items:center; justify-content:center; gap:8px; box-shadow:0 8px 22px rgba(232,71,42,.4); font-family:inherit; }
  .home-ind { position:absolute; bottom:9px; left:50%; transform:translateX(-50%); width:134px; height:5px; border-radius:3px; background:#2c241b; opacity:.85; z-index:55; }
  .backbtn:active, .cam:active, .frow:active, .pill:active, .savebtn:active { transform:scale(.97); }
</style>
</head>
<body>
<div class="phone">
  <div class="notch"></div>
  <div class="status">
    <span>9:41</span>
    <span class="right">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="none"><rect x="0" y="7" width="3" height="5" rx="1" fill="#2c241b"/><rect x="5" y="4.5" width="3" height="7.5" rx="1" fill="#2c241b"/><rect x="10" y="2" width="3" height="10" rx="1" fill="#2c241b"/><rect x="15" y="0" width="3" height="12" rx="1" fill="#2c241b" opacity=".4"/></svg>
      <svg width="17" height="12" viewBox="0 0 17 12" fill="none"><path d="M8.5 2.5C11 2.5 13.2 3.5 14.8 5.1L8.5 11.4 2.2 5.1C3.8 3.5 6 2.5 8.5 2.5Z" fill="#2c241b"/></svg>
      <svg width="26" height="13" viewBox="0 0 26 13" fill="none"><rect x="1" y="1" width="21" height="11" rx="3" stroke="#2c241b" stroke-width="1.2" opacity=".5"/><rect x="3" y="3" width="16" height="7" rx="1.5" fill="#2c241b"/><rect x="23.5" y="4.5" width="2" height="4" rx="1" fill="#2c241b" opacity=".6"/></svg>
    </span>
  </div>

  <div class="scroll">
    <div class="nav">
      <div class="backbtn"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#fbf8f3" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></div>
      <h1>编辑<span class="pop">资料</span></h1>
      <span class="navsave">保存</span>
    </div>

    <div class="avatar-wrap">
      <div class="eyebrow">Your Profile</div>
      <div class="avatar">
        <div class="ava-txt">张</div>
        <div class="cam"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h2.5l1.2-2h6.6l1.2 2H19a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2v-8a2 2 0 012-2z"/><circle cx="12" cy="13" r="3.3"/></svg></div>
      </div>
      <div class="avatar-hint">更换头像</div>
    </div>

    <div class="grlabel" style="padding:0 24px; margin:6px 0 9px; font-family:var(--serif); font-style:italic; font-size:12px; letter-spacing:.5px; color:var(--gold-deep); font-weight:700;">基本信息</div>
    <div class="group">
      <div class="frow">
        <div class="fic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.6"/><path d="M5 20c0-3.6 3.1-6 7-6s7 2.4 7 6"/></svg></div>
        <div class="flabel">昵称</div>
        <div class="fval">小张</div>
        <div class="chev"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg></div>
      </div>
      <div class="frow">
        <div class="fic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="14" r="5"/><path d="M14 10l5-5M15 5h4v4"/></svg></div>
        <div class="flabel">性别</div>
        <div class="pillrow" style="flex:1; justify-content:flex-end;">
          <div class="pill on">男</div>
          <div class="pill">女</div>
        </div>
      </div>
      <div class="frow">
        <div class="fic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="3" width="12" height="18" rx="2.5"/><path d="M10.5 18h3"/></svg></div>
        <div class="flabel" style="width:64px;">手机号</div>
        <div class="fval">138 8888 6666</div>
        <div class="chev"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg></div>
      </div>
      <div class="frow">
        <div class="fic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="16" rx="3"/><path d="M4 9h16M8 3v4M16 3v4"/></svg></div>
        <div class="flabel">生日</div>
        <div class="fval">1996 / 03 / 18</div>
        <div class="chev"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg></div>
      </div>
    </div>

    <div class="grlabel" style="padding:0 24px; margin:26px 0 9px; font-family:var(--serif); font-style:italic; font-size:12px; letter-spacing:.5px; color:var(--gold-deep); font-weight:700;">关于口味</div>
    <div class="group">
      <div class="frow">
        <div class="fic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c4 4 6 7 6 10a6 6 0 01-12 0c0-3 2-6 6-10z"/></svg></div>
        <div class="flabel" style="width:64px;">口味偏好</div>
        <div class="fval ph">微辣 · 少油</div>
        <div class="chev"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg></div>
      </div>
      <div class="frow">
        <div class="fic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M5 6h7M5 11h7"/><path d="M19 2c-2 2-3 4-3 7s1 4 3 5"/></svg></div>
        <div class="flabel" style="width:64px;">忌口食材</div>
        <div class="fval ph">香菜 · 内脏</div>
        <div class="chev"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg></div>
      </div>
    </div>

    <div class="savebar">
      <button class="savebtn"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>保存修改</button>
    </div>
  </div>
  <div class="home-ind"></div>
</div>
</body>
</html>
