<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>家庭点菜 · 加载中</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-font-smoothing:antialiased; }
  :root{
    --paper:#fbf8f3; --paper-2:#f0ebe2;
    --ink:#2c241b; --ink-deep:#3a2e23;
    --mut:#9a8e7d; --mut-strong:#7a6e5d;
    --gold-deep:#b08949;
    --pop:#e8472a;
    --sk:#efe9df;
    --serif:"Georgia","Times New Roman",serif;
  }
  body {
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; background:#d9d2c7;
    font-family:-apple-system,"SF Pro Text","Helvetica Neue",Helvetica,Arial,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  }
  .phone {
    position:relative; width:390px; height:844px;
    background:var(--paper); border-radius:46px;
    box-shadow:0 30px 70px rgba(60,45,30,.4), 0 0 0 11px #1b1714, 0 0 0 12px #2c2520;
    overflow:hidden;
  }
  .status {
    position:absolute; top:0; left:0; right:0; height:50px; z-index:60;
    display:flex; align-items:center; justify-content:space-between;
    padding:0 30px 0 34px; color:var(--ink); font-size:15px; font-weight:600; pointer-events:none;
  }
  .status .right { display:flex; align-items:center; gap:7px; }
  .notch { position:absolute; top:11px; left:50%; transform:translateX(-50%); width:118px; height:33px; background:#1b1714; border-radius:20px; z-index:61; }

  /* header area */
  .head { position:absolute; top:62px; left:24px; right:24px; z-index:10; }
  .sk-pill { background:var(--sk); border-radius:30px; }
  .sk-block { background:var(--sk); border-radius:10px; }
  .head .h-eye { width:96px; height:13px; border-radius:4px; }
  .head .h-title { width:210px; height:26px; margin-top:11px; border-radius:7px; }

  /* chips skeleton */
  .chips { position:absolute; top:148px; left:24px; right:0; display:flex; gap:9px; z-index:10; }
  .chips .c { height:34px; border-radius:30px; flex:none; }

  /* cards skeleton */
  .list { position:absolute; top:204px; left:24px; right:24px; z-index:10; }
  .card {
    background:#fff; border-radius:22px; overflow:hidden; margin-bottom:18px;
    box-shadow:0 2px 6px rgba(60,40,20,.05), 0 14px 32px rgba(120,70,30,.10); border:1px solid #f1ece2;
    display:flex; gap:0;
  }
  .card .cover { width:118px; height:118px; flex:none; background:var(--sk); position:relative; overflow:hidden; }
  .card .body { flex:1; min-width:0; padding:18px 18px 16px; }
  .card .b-title { width:62%; height:18px; border-radius:6px; }
  .card .b-meta { display:flex; gap:10px; margin-top:14px; }
  .card .b-meta .m1 { width:74px; height:12px; border-radius:4px; }
  .card .b-meta .m2 { width:56px; height:12px; border-radius:4px; }
  .card .b-line { width:88%; height:11px; border-radius:4px; margin-top:13px; }
  .card .b-tag { width:48px; height:22px; border-radius:6px; margin-top:16px; }

  /* shimmer overlay */
  .sk, .sk-pill, .sk-block, .card .cover { position:relative; overflow:hidden; }
  .shim::after {
    content:""; position:absolute; inset:0;
    background:linear-gradient(100deg, transparent 20%, rgba(255,255,255,.65) 50%, transparent 80%);
    transform:translateX(-100%); animation:shimmer 1.5s infinite;
  }
  @keyframes shimmer { 100% { transform:translateX(100%); } }

  /* center loading */
  .loading {
    position:absolute; left:0; right:0; bottom:96px; z-index:20;
    display:flex; flex-direction:column; align-items:center; gap:16px;
  }
  .spinner { width:46px; height:46px; }
  .spinner svg { width:100%; height:100%; animation:spin 0.9s linear infinite; transform-origin:center; }
  @keyframes spin { 100% { transform:rotate(360deg); } }
  .loading .txt { font-size:13.5px; font-weight:600; color:var(--mut-strong); letter-spacing:.5px; }
  .loading .eyebrow { font-family:var(--serif); font-style:italic; font-size:12px; letter-spacing:1px; color:var(--gold-deep); font-weight:700; margin-top:-4px; }
  .dots span { display:inline-block; animation:blink 1.4s infinite both; }
  .dots span:nth-child(2){ animation-delay:.2s; }
  .dots span:nth-child(3){ animation-delay:.4s; }
  @keyframes blink { 0%,80%,100%{opacity:.2;} 40%{opacity:1;} }

  .home-ind { position:absolute; bottom:9px; left:50%; transform:translateX(-50%); width:134px; height:5px; border-radius:3px; background:#2c241b; opacity:.85; z-index:55; }
</style>
</head>
<body>
<div class="phone">
  <div class="notch"></div>
  <div class="status">
    <span>9:41</span>
    <span class="right">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="none"><rect x="0" y="7" width="3" height="5" rx="1" fill="#2c241b"/><rect x="5" y="4.5" width="3" height="7.5" rx="1" fill="#2c241b"/><rect x="10" y="2" width="3" height="10" rx="1" fill="#2c241b"/><rect x="15" y="0" width="3" height="12" rx="1" fill="#2c241b" opacity=".4"/></svg>
      <svg width="17" height="12" viewBox="0 0 17 12" fill="none"><path d="M8.5 2.5C11 2.5 13.2 3.5 14.8 5.1L8.5 11.4 2.2 5.1C3.8 3.5 6 2.5 8.5 2.5Z" fill="#2c241b"/></svg>
      <svg width="26" height="13" viewBox="0 0 26 13" fill="none"><rect x="1" y="1" width="21" height="11" rx="3" stroke="#2c241b" stroke-width="1.2" opacity=".5"/><rect x="3" y="3" width="16" height="7" rx="1.5" fill="#2c241b"/><rect x="23.5" y="4.5" width="2" height="4" rx="1" fill="#2c241b" opacity=".6"/></svg>
    </span>
  </div>

  <!-- header skeleton -->
  <div class="head">
    <div class="sk-pill shim h-eye"></div>
    <div class="sk-block shim h-title"></div>
  </div>

  <!-- chips skeleton -->
  <div class="chips">
    <div class="sk-pill shim c" style="width:58px"></div>
    <div class="sk-pill shim c" style="width:72px"></div>
    <div class="sk-pill shim c" style="width:64px"></div>
    <div class="sk-pill shim c" style="width:80px"></div>
  </div>

  <!-- card skeletons -->
  <div class="list">
    <div class="card">
      <div class="cover shim"></div>
      <div class="body">
        <div class="sk-block shim b-title"></div>
        <div class="b-meta">
          <div class="sk-block shim m1"></div>
          <div class="sk-block shim m2"></div>
        </div>
        <div class="sk-block shim b-line"></div>
        <div class="sk-block shim b-tag"></div>
      </div>
    </div>
    <div class="card">
      <div class="cover shim"></div>
      <div class="body">
        <div class="sk-block shim b-title" style="width:54%"></div>
        <div class="b-meta">
          <div class="sk-block shim m1"></div>
          <div class="sk-block shim m2"></div>
        </div>
        <div class="sk-block shim b-line" style="width:80%"></div>
        <div class="sk-block shim b-tag"></div>
      </div>
    </div>
    <div class="card">
      <div class="cover shim"></div>
      <div class="body">
        <div class="sk-block shim b-title" style="width:68%"></div>
        <div class="b-meta">
          <div class="sk-block shim m1"></div>
          <div class="sk-block shim m2"></div>
        </div>
        <div class="sk-block shim b-line" style="width:72%"></div>
        <div class="sk-block shim b-tag"></div>
      </div>
    </div>
  </div>

  <!-- center loading state -->
  <div class="loading">
    <div class="spinner">
      <svg viewBox="0 0 50 50" fill="none">
        <circle cx="25" cy="25" r="20" stroke="#efe2cf" stroke-width="5"/>
        <path d="M25 5a20 20 0 0 1 20 20" stroke="#e8472a" stroke-width="5" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="txt">加载中<span class="dots"><span>.</span><span>.</span><span>.</span></span></div>
    <div class="eyebrow">正在张罗这一桌</div>
  </div>

  <div class="home-ind"></div>
</div>
</body>
</html>
