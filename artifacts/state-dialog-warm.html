<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>家庭点菜 · 确认弹窗</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-font-smoothing:antialiased; }
  :root{
    --paper:#fbf8f3; --paper-2:#f0ebe2;
    --ink:#2c241b; --ink-deep:#3a2e23;
    --mut:#9a8e7d; --mut-2:#b3a795; --mut-strong:#7a6e5d;
    --gold:#f4d9a8; --gold-deep:#b08949;
    --pop:#e8472a; --pop-soft:#fdece6;
    --serif:"Georgia","Times New Roman",serif;
  }
  body {
    display:flex; align-items:flex-start; justify-content:center; gap:40px; flex-wrap:wrap;
    min-height:100vh; background:#d9d2c7; padding:40px 20px;
    font-family:-apple-system,"SF Pro Text","Helvetica Neue",Helvetica,Arial,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  }
  .stage { display:flex; flex-direction:column; align-items:center; gap:14px; }
  .stage .cap { font-family:var(--serif); font-style:italic; font-size:13px; color:#7a6e5d; letter-spacing:.5px; }
  .phone {
    position:relative; width:390px; height:844px;
    background:var(--paper); border-radius:46px;
    box-shadow:0 30px 70px rgba(60,45,30,.4), 0 0 0 11px #1b1714, 0 0 0 12px #2c2520;
    overflow:hidden;
  }
  .notch { position:absolute; top:11px; left:50%; transform:translateX(-50%); width:118px; height:33px; background:#1b1714; border-radius:20px; z-index:61; }
  .status {
    position:absolute; top:0; left:0; right:0; height:50px; z-index:60;
    display:flex; align-items:center; justify-content:space-between;
    padding:0 30px 0 34px; color:var(--ink); font-size:15px; font-weight:600; pointer-events:none;
  }
  .status .right { display:flex; align-items:center; gap:7px; }

  /* ---- simplified home background (blurred & dimmed) ---- */
  .bg { position:absolute; inset:0; background:var(--paper); filter:saturate(.92); }
  .bg-hero { height:300px; background:url('img/mapo-tofu.jpg') center/cover no-repeat; position:relative; }
  .bg-hero::after { content:""; position:absolute; inset:0; background:linear-gradient(180deg,rgba(20,14,8,.45),rgba(20,14,8,.1) 50%,rgba(20,14,8,.7)); }
  .bg-sheet { background:var(--paper); border-radius:28px 28px 0 0; margin-top:-26px; position:relative; padding:24px; }
  .bg-chips { display:flex; gap:9px; }
  .bg-chip { font-size:13px; font-weight:600; color:var(--mut); padding:9px 16px; border-radius:30px; background:var(--paper-2); }
  .bg-chip.on { background:var(--ink-deep); color:var(--paper); }
  .bg-row { display:flex; align-items:center; gap:15px; padding:14px 0; border-bottom:1px solid #efe9df; }
  .bg-thumb { width:70px; height:70px; border-radius:18px; background-size:cover; background-position:center; flex:none; }
  .bg-line { height:13px; border-radius:6px; background:#ece5da; }
  .bg-line.s { width:55%; height:10px; margin-top:9px; background:#f0ebe2; }

  /* ---- overlay ---- */
  .overlay { position:absolute; inset:0; z-index:80; background:rgba(20,14,8,.45); backdrop-filter:blur(2px);
    display:flex; align-items:center; justify-content:center; padding:0 30px; }

  .dialog { width:100%; max-width:320px; background:#fff; border-radius:20px; overflow:hidden;
    box-shadow:0 20px 50px rgba(30,18,8,.4), 0 4px 12px rgba(30,18,8,.2);
    animation:pop .35s cubic-bezier(.2,.9,.3,1.3) both; }
  @keyframes pop { from{ opacity:0; transform:scale(.9) translateY(8px);} to{ opacity:1; transform:scale(1) translateY(0);} }

  .dlg-body { padding:30px 26px 24px; text-align:center; }
  .dlg-ic { width:68px; height:68px; border-radius:50%; margin:0 auto 18px; display:flex; align-items:center; justify-content:center; position:relative; }
  .dlg-ic.danger { background:var(--pop-soft); }
  .dlg-ic.danger::after { content:""; position:absolute; inset:-7px; border-radius:50%; border:1.5px solid rgba(232,71,42,.18); }
  .dlg-ic.warn { background:#fdf3e2; }
  .dlg-ic.warn::after { content:""; position:absolute; inset:-7px; border-radius:50%; border:1.5px solid rgba(176,137,73,.2); }
  .dlg-title { font-size:20px; font-weight:900; color:var(--ink); letter-spacing:-.5px;
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif; }
  .dlg-title .pop { color:var(--pop); }
  .dlg-desc { font-size:14px; color:var(--mut-strong); margin-top:9px; line-height:1.55; }
  .dlg-dish { display:flex; align-items:center; gap:12px; background:var(--paper); border:1px solid #efe9df; border-radius:14px; padding:11px 13px; margin-top:18px; text-align:left; }
  .dlg-dish .t { width:46px; height:46px; border-radius:12px; background-size:cover; background-position:center; flex:none; }
  .dlg-dish .n { font-size:15px; font-weight:800; color:var(--ink); }
  .dlg-dish .m { font-size:12px; color:var(--mut); margin-top:3px; }

  .dlg-actions { display:flex; gap:11px; padding:0 22px 22px; }
  .btn { flex:1; height:50px; border-radius:14px; font-size:15.5px; font-weight:800; display:flex; align-items:center; justify-content:center; gap:7px;
    font-family:"PingFang SC","Microsoft YaHei",sans-serif; letter-spacing:.3px; }
  .btn.ghost { background:var(--paper-2); color:var(--ink-deep); }
  .btn.danger { background:var(--pop); color:#fff; box-shadow:0 2px 4px rgba(180,40,20,.3), 0 10px 22px rgba(232,71,42,.4); }
  .btn.warm { background:var(--gold-deep); color:#fff; box-shadow:0 2px 4px rgba(140,100,40,.3), 0 10px 22px rgba(176,137,73,.4); }
  .btn:active { transform:scale(.97); }

  .home-ind { position:absolute; bottom:9px; left:50%; transform:translateX(-50%); width:134px; height:5px; border-radius:3px; background:#2c241b; opacity:.85; z-index:90; }
</style>
</head>
<body>

<!-- ======= 主展示:删除确认 ======= -->
<div class="stage">
  <div class="cap">删菜确认</div>
  <div class="phone">
    <div class="notch"></div>
    <div class="status">
      <span>9:41</span>
      <span class="right">
        <svg width="18" height="12" viewBox="0 0 18 12" fill="none"><rect x="0" y="7" width="3" height="5" rx="1" fill="#2c241b"/><rect x="5" y="4.5" width="3" height="7.5" rx="1" fill="#2c241b"/><rect x="10" y="2" width="3" height="10" rx="1" fill="#2c241b"/><rect x="15" y="0" width="3" height="12" rx="1" fill="#2c241b" opacity=".4"/></svg>
        <svg width="17" height="12" viewBox="0 0 17 12" fill="none"><path d="M8.5 2.5C11 2.5 13.2 3.5 14.8 5.1L8.5 11.4 2.2 5.1C3.8 3.5 6 2.5 8.5 2.5Z" fill="#2c241b"/></svg>
        <svg width="26" height="13" viewBox="0 0 26 13" fill="none"><rect x="1" y="1" width="21" height="11" rx="3" stroke="#2c241b" stroke-width="1.2" opacity=".5"/><rect x="3" y="3" width="16" height="7" rx="1.5" fill="#2c241b"/><rect x="23.5" y="4.5" width="2" height="4" rx="1" fill="#2c241b" opacity=".6"/></svg>
      </span>
    </div>

    <!-- 简化首页背景 -->
    <div class="bg">
      <div class="bg-hero"></div>
      <div class="bg-sheet">
        <div class="bg-chips"><span class="bg-chip on">全部</span><span class="bg-chip">川菜</span><span class="bg-chip">家常</span><span class="bg-chip">面点</span></div>
        <div style="margin-top:20px;">
          <div class="bg-row"><div class="bg-thumb" style="background-image:url('img/tomato-egg.jpg')"></div><div style="flex:1"><div class="bg-line" style="width:42%"></div><div class="bg-line s"></div></div></div>
          <div class="bg-row"><div class="bg-thumb" style="background-image:url('img/hongshao-pork.jpg')"></div><div style="flex:1"><div class="bg-line" style="width:36%"></div><div class="bg-line s"></div></div></div>
          <div class="bg-row" style="border-bottom:none"><div class="bg-thumb" style="background-image:url('img/long-beans.jpg')"></div><div style="flex:1"><div class="bg-line" style="width:48%"></div><div class="bg-line s"></div></div></div>
        </div>
      </div>
    </div>

    <!-- 遮罩 + 删除确认弹窗 -->
    <div class="overlay">
      <div class="dialog">
        <div class="dlg-body">
          <div class="dlg-ic danger">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#e8472a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a1 1 0 011-1h6a1 1 0 011 1v2"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg>
          </div>
          <div class="dlg-title">确定删掉<span class="pop">这道菜</span>？</div>
          <div class="dlg-desc">删了就找不回来了，今日菜单里也会一起去掉</div>
          <div class="dlg-dish">
            <div class="t" style="background-image:url('img/mapo-tofu.jpg')"></div>
            <div><div class="n">麻婆豆腐</div><div class="m">川菜 · 做过 3 次</div></div>
          </div>
        </div>
        <div class="dlg-actions">
          <div class="btn ghost">取消</div>
          <div class="btn danger">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M8 6V4a1 1 0 011-1h6a1 1 0 011 1v2"/></svg>
            删除
          </div>
        </div>
      </div>
    </div>
    <div class="home-ind"></div>
  </div>
</div>

<!-- ======= 变体:退出登录确认 ======= -->
<div class="stage">
  <div class="cap">退出确认</div>
  <div class="phone">
    <div class="notch"></div>
    <div class="status">
      <span>9:41</span>
      <span class="right">
        <svg width="18" height="12" viewBox="0 0 18 12" fill="none"><rect x="0" y="7" width="3" height="5" rx="1" fill="#2c241b"/><rect x="5" y="4.5" width="3" height="7.5" rx="1" fill="#2c241b"/><rect x="10" y="2" width="3" height="10" rx="1" fill="#2c241b"/><rect x="15" y="0" width="3" height="12" rx="1" fill="#2c241b" opacity=".4"/></svg>
        <svg width="17" height="12" viewBox="0 0 17 12" fill="none"><path d="M8.5 2.5C11 2.5 13.2 3.5 14.8 5.1L8.5 11.4 2.2 5.1C3.8 3.5 6 2.5 8.5 2.5Z" fill="#2c241b"/></svg>
        <svg width="26" height="13" viewBox="0 0 26 13" fill="none"><rect x="1" y="1" width="21" height="11" rx="3" stroke="#2c241b" stroke-width="1.2" opacity=".5"/><rect x="3" y="3" width="16" height="7" rx="1.5" fill="#2c241b"/><rect x="23.5" y="4.5" width="2" height="4" rx="1" fill="#2c241b" opacity=".6"/></svg>
      </span>
    </div>

    <!-- 简化"我的"页背景 -->
    <div class="bg">
      <div style="height:200px; background:linear-gradient(150deg,#3a2e23,#2c241b); position:relative;"></div>
      <div class="bg-sheet" style="margin-top:-40px;">
        <div style="display:flex; align-items:center; gap:14px;">
          <div style="width:64px;height:64px;border-radius:20px;background:var(--gold-deep);flex:none;"></div>
          <div style="flex:1"><div class="bg-line" style="width:40%;height:15px"></div><div class="bg-line s"></div></div>
        </div>
        <div style="margin-top:24px;">
          <div class="bg-row"><div style="width:38px;height:38px;border-radius:11px;background:var(--paper-2);flex:none;"></div><div style="flex:1"><div class="bg-line" style="width:50%"></div></div></div>
          <div class="bg-row"><div style="width:38px;height:38px;border-radius:11px;background:var(--paper-2);flex:none;"></div><div style="flex:1"><div class="bg-line" style="width:44%"></div></div></div>
          <div class="bg-row" style="border-bottom:none"><div style="width:38px;height:38px;border-radius:11px;background:var(--paper-2);flex:none;"></div><div style="flex:1"><div class="bg-line" style="width:56%"></div></div></div>
        </div>
      </div>
    </div>

    <!-- 遮罩 + 退出登录弹窗 -->
    <div class="overlay">
      <div class="dialog">
        <div class="dlg-body">
          <div class="dlg-ic warn">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#b08949" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
          </div>
          <div class="dlg-title">真的要退出登录？</div>
          <div class="dlg-desc">退出后得重新登录<br>才能看到一家人的菜单和点菜记录</div>
        </div>
        <div class="dlg-actions">
          <div class="btn ghost">再想想</div>
          <div class="btn warm">退出登录</div>
        </div>
      </div>
    </div>
    <div class="home-ind"></div>
  </div>
</div>

</body>
</html>
