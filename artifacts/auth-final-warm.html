<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>家庭点菜 · 登录</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-font-smoothing:antialiased; }
  :root{
    --paper:#fbf8f3; --paper-2:#f0ebe2;
    --ink:#2c241b; --ink-deep:#3a2e23;
    --mut:#9a8e7d; --mut-2:#b3a795;
    --gold:#f4d9a8; --gold-deep:#b08949;
    --pop:#e8472a;
    --pop-soft:#fdece6;
    --pine:#2f4a3a;
    --wx:#07c160;
    --serif:"Georgia","Times New Roman",serif;
  }
  body {
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; background:#d9d2c7;
    font-family:-apple-system,"SF Pro Text","Helvetica Neue",Helvetica,Arial,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  }
  .phone {
    position:relative; width:390px; height:844px;
    background:var(--paper); border-radius:46px;
    box-shadow:0 30px 70px rgba(60,45,30,.4), 0 0 0 11px #1b1714, 0 0 0 12px #2c2520;
    overflow:hidden;
  }
  .status {
    position:absolute; top:0; left:0; right:0; height:50px; z-index:60;
    display:flex; align-items:center; justify-content:space-between;
    padding:0 30px 0 34px; color:#fff; font-size:15px; font-weight:600; pointer-events:none;
  }
  .status .right { display:flex; align-items:center; gap:7px; }
  .notch { position:absolute; top:11px; left:50%; transform:translateX(-50%); width:118px; height:33px; background:#1b1714; border-radius:20px; z-index:61; }
  .scroll { position:absolute; inset:0; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch; }
  .scroll::-webkit-scrollbar { display:none; }
  :active.tapscale { transform:scale(.97); }
  .tapscale { transition:transform .12s ease; }
  .tapscale:active { transform:scale(.97); }

  /* hero banner */
  .hero { position:relative; height:452px; background:url('img/chicken-congee.jpg') center/cover no-repeat; }
  .hero::before { content:""; position:absolute; inset:0; z-index:1;
    background:radial-gradient(120% 80% at 50% 0%, rgba(255,180,80,.16), transparent 55%); mix-blend-mode:overlay; }
  .hero::after { content:""; position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(20,14,8,.5) 0%, rgba(20,14,8,0) 28%, rgba(20,14,8,.18) 52%, rgba(20,14,8,.9) 100%); }
  .hero-bignum { position:absolute; top:74px; right:-2px; z-index:2; font-family:var(--serif); font-size:230px; font-weight:700; line-height:1; color:rgba(255,255,255,.07); pointer-events:none; }
  .brandbar { position:absolute; top:62px; left:24px; z-index:10; display:flex; align-items:center; gap:10px; }
  .brandbar .logo { width:40px; height:40px; border-radius:13px; background:var(--pop); display:flex; align-items:center; justify-content:center; box-shadow:0 8px 18px rgba(232,71,42,.4); }
  .brandbar .bt { color:#fff; }
  .brandbar .bt .en { font-family:var(--serif); font-style:italic; font-size:11px; letter-spacing:1.5px; opacity:.85; }
  .brandbar .bt .cn { font-size:15px; font-weight:800; letter-spacing:-.3px; margin-top:1px; }
  .hero-body { position:absolute; left:24px; right:24px; bottom:46px; z-index:10; color:#fff; }
  .tag { display:inline-block; font-family:var(--serif); font-style:italic; font-size:12px; letter-spacing:1.5px; font-weight:700;
    color:#fff; background:var(--pop); padding:6px 14px; border-radius:4px; }
  .hero-title { font-size:54px; line-height:.9; font-weight:900; letter-spacing:-3px; margin:16px 0 14px;
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    color:transparent; -webkit-text-stroke:1.6px #fff; text-stroke:1.6px #fff; }
  .hero-title .pop { color:var(--pop); -webkit-text-stroke:0; text-stroke:0; }
  .slogan { font-size:16px; font-weight:500; color:rgba(255,255,255,.9); letter-spacing:.5px; }
  .slogan .pop { color:var(--pop); font-weight:800; }

  /* body sheet */
  .sheet { position:relative; margin-top:-26px; background:var(--paper); border-radius:28px 28px 0 0; padding:26px 24px 40px; z-index:20; }

  .btn-wx { width:100%; background:var(--wx); color:#fff; border:none; border-radius:18px; padding:17px; font-size:16.5px; font-weight:800; letter-spacing:.5px;
    display:flex; align-items:center; justify-content:center; gap:10px; box-shadow:0 2px 6px rgba(7,140,70,.3), 0 14px 30px rgba(7,193,96,.32); font-family:inherit; }
  .btn-phone { width:100%; margin-top:14px; background:#fff; color:var(--ink-deep); border:1.5px solid #ece4d6; border-radius:18px; padding:16px; font-size:16px; font-weight:800;
    display:flex; align-items:center; justify-content:center; gap:10px; box-shadow:0 2px 6px rgba(60,40,20,.05); font-family:inherit; }
  .authlinks { display:flex; align-items:center; justify-content:center; gap:0; margin-top:20px; }
  .authlinks a { font-size:13.5px; font-weight:700; color:var(--ink-deep); text-decoration:none; padding:8px 16px; }
  .authlinks .sep { width:1px; height:13px; background:#d8cebd; }
  .guest { text-align:center; margin-top:8px; }
  .guest a { font-size:14px; font-weight:600; color:var(--mut); text-decoration:none; display:inline-block; padding:10px 4px; }

  .divider { display:flex; align-items:center; gap:14px; margin:26px 0 20px; }
  .divider .ln { flex:1; height:1px; background:#e6ddcf; }
  .divider span { font-family:var(--serif); font-style:italic; font-size:12px; letter-spacing:1px; color:var(--gold-deep); font-weight:700; }

  /* trust points */
  .trust { display:flex; flex-direction:column; gap:14px; }
  .trust .ti { display:flex; align-items:center; gap:13px; }
  .trust .tic { width:40px; height:40px; border-radius:13px; flex:none; display:flex; align-items:center; justify-content:center; background:var(--pop-soft); }
  .trust .ttx .h { font-size:14.5px; font-weight:800; color:var(--ink); letter-spacing:-.3px; }
  .trust .ttx .s { font-size:12px; color:var(--mut); margin-top:2px; }

  /* agreement */
  .agree { display:flex; align-items:flex-start; gap:9px; margin-top:26px; padding:0 4px; }
  .agree .box { width:40px; height:40px; flex:none; display:flex; align-items:center; justify-content:center; margin:-11px 0 0 -11px; }
  .agree .box::before { content:""; width:18px; height:18px; border-radius:6px; border:1.5px solid #d8d0c2; background:transparent; }
  .agree .tx { font-size:11.5px; color:#7a6e5d; line-height:1.6; }
  .agree .tx a { color:var(--gold-deep); font-weight:700; text-decoration:none; }
  .home-ind { position:absolute; bottom:9px; left:50%; transform:translateX(-50%); width:134px; height:5px; border-radius:3px; background:#2c241b; opacity:.85; z-index:55; }
</style>
</head>
<body>
<div class="phone">
  <div class="notch"></div>
  <div class="status">
    <span>9:41</span>
    <span class="right">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="none"><rect x="0" y="7" width="3" height="5" rx="1" fill="#fff"/><rect x="5" y="4.5" width="3" height="7.5" rx="1" fill="#fff"/><rect x="10" y="2" width="3" height="10" rx="1" fill="#fff"/><rect x="15" y="0" width="3" height="12" rx="1" fill="#fff" opacity=".4"/></svg>
      <svg width="17" height="12" viewBox="0 0 17 12" fill="none"><path d="M8.5 2.5C11 2.5 13.2 3.5 14.8 5.1L8.5 11.4 2.2 5.1C3.8 3.5 6 2.5 8.5 2.5Z" fill="#fff"/></svg>
      <svg width="26" height="13" viewBox="0 0 26 13" fill="none"><rect x="1" y="1" width="21" height="11" rx="3" stroke="#fff" stroke-width="1.2" opacity=".5"/><rect x="3" y="3" width="16" height="7" rx="1.5" fill="#fff"/><rect x="23.5" y="4.5" width="2" height="4" rx="1" fill="#fff" opacity=".6"/></svg>
    </span>
  </div>

  <div class="scroll">
    <div class="hero">
      <div class="hero-bignum">01</div>
      <div class="brandbar">
        <div class="logo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5L12 4l8 6.5"/><path d="M6 9.5V20h12V9.5"/><path d="M10 20v-4h4v4"/></svg></div>
        <div class="bt"><div class="en">家的味道</div><div class="cn">家庭点菜</div></div>
      </div>
      <div class="hero-body">
        <span class="tag">欢迎回家</span>
        <div class="hero-title">今天吃什么<br>一家人<span class="pop">说了算</span></div>
        <div class="slogan">一家人的饭桌，<span class="pop">一家人</span>做主</div>
      </div>
    </div>

    <div class="sheet">
      <button class="btn-wx tapscale">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="#fff"><path d="M9.2 3C5 3 1.6 5.9 1.6 9.5c0 2 1.1 3.8 2.9 5l-.7 2.2 2.6-1.3c.9.2 1.8.4 2.8.4h.5a5.6 5.6 0 01-.3-1.8c0-3.4 3.2-6.1 7.1-6.1h.5C16.8 5.2 13.4 3 9.2 3zM6.6 8.2a1 1 0 110-2 1 1 0 010 2zm5.2 0a1 1 0 110-2 1 1 0 010 2z"/><path d="M22.4 14c0-2.9-2.8-5.2-6.2-5.2S10 11.1 10 14s2.8 5.2 6.2 5.2c.7 0 1.4-.1 2.1-.3l1.9 1-.5-1.7c1.6-1 2.7-2.5 2.7-4.2zm-8.2-.9a.8.8 0 110-1.6.8.8 0 010 1.6zm4 0a.8.8 0 110-1.6.8.8 0 010 1.6z"/></svg>
        微信一键登录
      </button>
      <a class="btn-phone tapscale" href="auth-phone.html">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3a2e23" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M11 18.5h2"/></svg>
        手机号登录
      </a>

      <div class="authlinks">
        <a href="auth-register.html">注册新账号</a>
        <div class="sep"></div>
        <a href="auth-reset.html">忘记密码</a>
      </div>

      <div class="guest"><a href="home-final.html">先随便逛逛 ›</a></div>

      <div class="divider"><div class="ln"></div><span>为什么用它</span><div class="ln"></div></div>

      <div class="trust">
        <div class="ti">
          <div class="tic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#e8472a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-4.4-7-9.5A3.8 3.8 0 0112 8a3.8 3.8 0 017 3.5C19 16.6 12 21 12 21z"/></svg></div>
          <div class="ttx"><div class="h">一家人共享同一份菜单</div><div class="s">今晚吃什么，全家一起说了算</div></div>
        </div>
        <div class="ti">
          <div class="tic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#e8472a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1.2 11H6.2L5 8z"/><path d="M8.5 8a3.5 3.5 0 017 0"/></svg></div>
          <div class="ttx"><div class="h">点完菜自动生成买菜清单</div><div class="s">缺什么一键加入，照着买不漏项</div></div>
        </div>
        <div class="ti">
          <div class="tic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#e8472a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5a2 2 0 012-2h9l5 5v11a2 2 0 01-2 2H6a2 2 0 01-2-2z"/><path d="M9 8h4M9 12h7M9 16h7"/></svg></div>
          <div class="ttx"><div class="h">记下家里每道拿手菜</div><div class="s">做过几次、谁掌勺，都帮你存好</div></div>
        </div>
      </div>

      <div class="agree">
        <div class="box tapscale"></div>
        <div class="tx">登录即表示你已阅读并同意 <a href="legal-terms.html">用户协议</a> 与 <a href="legal-privacy.html">隐私政策</a>，我们仅用微信昵称和头像帮你和家人互相认出。</div>
      </div>
    </div>
  </div>

  <div class="home-ind"></div>
</div>
</body>
</html>
