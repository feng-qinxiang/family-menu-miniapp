<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>家庭点菜 · 注册账号</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-font-smoothing:antialiased; }
  :root{
    --paper:#fbf8f3; --paper-2:#f0ebe2;
    --ink:#2c241b; --ink-deep:#3a2e23;
    --mut:#9a8e7d; --mut-2:#b3a795; --mut-strong:#7a6e5d;
    --gold:#f4d9a8; --gold-deep:#b08949;
    --pop:#e8472a;
    --pop-soft:#fdece6;
    --serif:"Georgia","Times New Roman",serif;
  }
  body {
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; background:#d9d2c7;
    font-family:-apple-system,"SF Pro Text","Helvetica Neue",Helvetica,Arial,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  }
  .phone {
    position:relative; width:390px; height:844px;
    background:var(--paper); border-radius:46px;
    box-shadow:0 30px 70px rgba(60,45,30,.4), 0 0 0 11px #1b1714, 0 0 0 12px #2c2520;
    overflow:hidden;
  }
  .status {
    position:absolute; top:0; left:0; right:0; height:50px; z-index:60;
    display:flex; align-items:center; justify-content:space-between;
    padding:0 30px 0 34px; color:#fff; font-size:15px; font-weight:600; pointer-events:none;
  }
  .status .right { display:flex; align-items:center; gap:7px; }
  .notch { position:absolute; top:11px; left:50%; transform:translateX(-50%); width:118px; height:33px; background:#1b1714; border-radius:20px; z-index:61; }
  .scroll { position:absolute; inset:0; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch; }
  .scroll::-webkit-scrollbar { display:none; }
  .tapscale { transition:transform .12s ease; }
  .tapscale:active { transform:scale(.97); }

  /* hero */
  .hero { position:relative; height:312px; background:url('img/tomato-egg.jpg') center/cover no-repeat; }
  .hero::before { content:""; position:absolute; inset:0; z-index:1;
    background:radial-gradient(120% 80% at 50% 0%, rgba(255,180,80,.16), transparent 55%); mix-blend-mode:overlay; }
  .hero::after { content:""; position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(20,14,8,.5) 0%, rgba(20,14,8,0) 30%, rgba(20,14,8,.2) 54%, rgba(20,14,8,.92) 100%); }
  .hero-bignum { position:absolute; top:60px; right:-2px; z-index:2; font-family:var(--serif); font-size:200px; font-weight:700; line-height:1; color:rgba(255,255,255,.07); pointer-events:none; }
  .topnav { position:absolute; top:60px; left:24px; z-index:12; }
  .topnav .back { width:42px; height:42px; border-radius:14px; background:rgba(44,36,27,.55); backdrop-filter:blur(6px); display:flex; align-items:center; justify-content:center; border:1px solid rgba(255,255,255,.18); }
  .brandbar { position:absolute; top:62px; right:24px; z-index:10; display:flex; align-items:center; gap:10px; }
  .brandbar .logo { width:40px; height:40px; border-radius:13px; background:var(--pop); display:flex; align-items:center; justify-content:center; box-shadow:0 8px 18px rgba(232,71,42,.4); }
  .hero-body { position:absolute; left:24px; right:24px; bottom:42px; z-index:10; color:#fff; }
  .tag { display:inline-block; font-family:var(--serif); font-style:italic; font-size:12px; letter-spacing:1.5px; font-weight:700;
    color:#fff; background:var(--pop); padding:6px 14px; border-radius:4px; }
  .hero-title { font-size:50px; line-height:.9; font-weight:900; letter-spacing:-2.5px; margin:14px 0 12px;
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    color:transparent; -webkit-text-stroke:1.6px #fff; text-stroke:1.6px #fff; }
  .hero-title .pop { color:var(--pop); -webkit-text-stroke:0; text-stroke:0; }
  .slogan { font-size:15px; font-weight:500; color:rgba(255,255,255,.9); letter-spacing:.4px; }

  /* sheet */
  .sheet { position:relative; margin-top:-26px; background:var(--paper); border-radius:28px 28px 0 0; padding:26px 24px 36px; z-index:20; }

  .field { position:relative; margin-bottom:16px; }
  .field label { display:block; font-size:11px; letter-spacing:1px; font-weight:800; text-transform:uppercase; color:var(--gold-deep); margin-bottom:8px; }
  .inp { display:flex; align-items:center; gap:11px; background:#fff; border:1.5px solid #ece4d6; border-radius:14px; padding:14px 16px; box-shadow:0 2px 6px rgba(60,40,20,.05); }
  .inp.focus { border-color:var(--pop); }
  .inp svg.lead { flex:none; }
  .inp .txt { font-size:16px; font-weight:700; color:var(--ink); flex:1; }
  .inp .ph { color:var(--mut-2); font-weight:600; }
  .inp .cur { width:2px; height:20px; background:var(--pop); border-radius:1px; }
  .inp .eye { width:40px; height:40px; margin:-13px -10px -13px 0; display:flex; align-items:center; justify-content:center; flex:none; }

  .codebtn { flex:none; background:var(--pop-soft); color:var(--pop); border:1px solid #f6cfc4; border-radius:11px; padding:9px 14px; font-size:13px; font-weight:800; font-family:inherit; white-space:nowrap; }
  .codebtn.wait { background:var(--paper-2); color:var(--mut-strong); border-color:#e6ddcf; }

  .hint { font-size:11.5px; color:var(--mut-strong); margin:-9px 2px 16px; line-height:1.5; }

  .createbtn { width:100%; margin-top:6px; background:var(--pop); color:#fff; border:none; border-radius:15px; padding:16px; font-size:16px; font-weight:800; letter-spacing:.3px;
    display:flex; align-items:center; justify-content:center; gap:8px; box-shadow:0 2px 6px rgba(180,40,20,.3), 0 12px 26px rgba(232,71,42,.36); font-family:inherit; }

  .gotologin { text-align:center; margin-top:20px; font-size:14px; color:var(--mut-strong); font-weight:600; }
  .gotologin a { color:var(--pop); font-weight:800; text-decoration:none; border-bottom:1.5px solid var(--pop-soft); padding-bottom:1px; }

  .agree { display:flex; align-items:flex-start; gap:9px; margin-top:22px; padding:0 4px; }
  .agree .box { width:40px; height:40px; flex:none; display:flex; align-items:center; justify-content:center; margin:-11px 0 0 -11px; }
  .agree .box .chk { width:19px; height:19px; border-radius:6px; border:1.5px solid #d8d0c2; background:transparent; display:flex; align-items:center; justify-content:center; }
  .agree .tx { font-size:11.5px; color:var(--mut-strong); line-height:1.6; }
  .agree .tx a { color:var(--gold-deep); font-weight:700; text-decoration:none; }

  .home-ind { position:absolute; bottom:9px; left:50%; transform:translateX(-50%); width:134px; height:5px; border-radius:3px; background:#2c241b; opacity:.85; z-index:55; }
</style>
</head>
<body>
<div class="phone">
  <div class="notch"></div>
  <div class="status">
    <span>9:41</span>
    <span class="right">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="none"><rect x="0" y="7" width="3" height="5" rx="1" fill="#fff"/><rect x="5" y="4.5" width="3" height="7.5" rx="1" fill="#fff"/><rect x="10" y="2" width="3" height="10" rx="1" fill="#fff"/><rect x="15" y="0" width="3" height="12" rx="1" fill="#fff" opacity=".4"/></svg>
      <svg width="17" height="12" viewBox="0 0 17 12" fill="none"><path d="M8.5 2.5C11 2.5 13.2 3.5 14.8 5.1L8.5 11.4 2.2 5.1C3.8 3.5 6 2.5 8.5 2.5Z" fill="#fff"/></svg>
      <svg width="26" height="13" viewBox="0 0 26 13" fill="none"><rect x="1" y="1" width="21" height="11" rx="3" stroke="#fff" stroke-width="1.2" opacity=".5"/><rect x="3" y="3" width="16" height="7" rx="1.5" fill="#fff"/><rect x="23.5" y="4.5" width="2" height="4" rx="1" fill="#fff" opacity=".6"/></svg>
    </span>
  </div>

  <div class="scroll">
    <div class="hero">
      <div class="hero-bignum">02</div>
      <div class="topnav">
        <div class="back tapscale"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></div>
      </div>
      <div class="brandbar">
        <div class="logo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5L12 4l8 6.5"/><path d="M6 9.5V20h12V9.5"/><path d="M10 20v-4h4v4"/></svg></div>
      </div>
      <div class="hero-body">
        <span class="tag">Sign Up</span>
        <div class="hero-title">注册<span class="pop">账号</span></div>
        <div class="slogan">手机号注册，开启一家人的味蕾日记</div>
      </div>
    </div>

    <div class="sheet">
      <div class="field">
        <label>手机号</label>
        <div class="inp focus">
          <svg class="lead" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#e8472a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="3"/><path d="M11 18h2"/></svg>
          <span class="txt">138 8888 6666</span><span class="cur"></span>
        </div>
      </div>

      <div class="field">
        <label>验证码</label>
        <div class="inp">
          <svg class="lead" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#b3a795" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8l9 6 9-6"/><rect x="3" y="5" width="18" height="14" rx="2"/></svg>
          <span class="txt ph">请输入 6 位验证码</span>
          <button class="codebtn tapscale">获取验证码</button>
        </div>
      </div>
      <p class="hint">验证码将发送至上方手机号，60 秒内有效。</p>

      <div class="field">
        <label>设置密码</label>
        <div class="inp">
          <svg class="lead" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#b3a795" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 018 0v3"/></svg>
          <span class="txt">••••••••</span>
          <span class="eye tapscale"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9a8e7d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg></span>
        </div>
      </div>

      <div class="field">
        <label>确认密码</label>
        <div class="inp">
          <svg class="lead" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#b3a795" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 018 0v3"/><path d="M9.5 15.5l1.8 1.8 3.2-3.6"/></svg>
          <span class="txt ph">再次输入密码</span>
          <span class="eye tapscale"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9a8e7d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/><path d="M3 3l18 18"/></svg></span>
        </div>
      </div>

      <button class="createbtn tapscale">注册账号
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      </button>

      <div class="gotologin">已有账号？<a href="auth-final.html">去登录 ›</a></div>

      <div class="agree">
        <div class="box tapscale"><span class="chk"></span></div>
        <div class="tx">我已阅读并同意 <a href="#">用户协议</a> 与 <a href="#">隐私政策</a>，注册即创建你在家庭点菜的账号。</div>
      </div>
    </div>
  </div>

  <div class="home-ind"></div>
</div>
</body>
</html>
