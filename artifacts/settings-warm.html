<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>家庭点菜 · 设置</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-font-smoothing:antialiased; }
  :root{
    --paper:#fbf8f3; --paper-2:#f0ebe2;
    --ink:#2c241b; --ink-deep:#3a2e23;
    --mut:#9a8e7d; --mut-strong:#7a6e5d;
    --gold-deep:#b08949;
    --pop:#e8472a; --pop-soft:#fdece6;
    --serif:"Georgia","Times New Roman",serif;
  }
  body {
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; background:#d9d2c7;
    font-family:-apple-system,"SF Pro Text","Helvetica Neue",Helvetica,Arial,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  }
  .phone {
    position:relative; width:390px; height:844px;
    background:var(--paper); border-radius:46px;
    box-shadow:0 30px 70px rgba(60,45,30,.4), 0 0 0 11px #1b1714, 0 0 0 12px #2c2520;
    overflow:hidden;
  }
  .status {
    position:absolute; top:0; left:0; right:0; height:50px; z-index:60;
    display:flex; align-items:center; justify-content:space-between;
    padding:0 30px 0 34px; color:var(--ink); font-size:15px; font-weight:600; pointer-events:none;
  }
  .status .right { display:flex; align-items:center; gap:7px; }
  .notch { position:absolute; top:11px; left:50%; transform:translateX(-50%); width:118px; height:33px; background:#1b1714; border-radius:20px; z-index:61; }
  .scroll { position:absolute; inset:0; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch; }
  .scroll::-webkit-scrollbar { display:none; }

  /* nav */
  .nav { position:relative; padding:62px 24px 8px; display:flex; align-items:center; gap:15px; }
  .backbtn { width:42px; height:42px; border-radius:50%; background:var(--ink-deep); display:flex; align-items:center; justify-content:center; flex:none; box-shadow:0 2px 6px rgba(60,40,20,.18), 0 10px 24px rgba(120,70,30,.18); }
  .nav h1 { font-size:30px; font-weight:900; color:var(--ink); letter-spacing:-1.5px; }
  .nav .eyebrow { font-family:var(--serif); font-style:italic; font-size:11.5px; letter-spacing:1px; color:var(--gold-deep); font-weight:700; margin-bottom:2px; }

  .body { padding:14px 24px 130px; }

  .gtitle { font-family:var(--serif); font-style:italic; font-size:12px; letter-spacing:1px; color:var(--gold-deep); font-weight:700; margin:24px 4px 11px; }
  .group:first-of-type .gtitle { margin-top:14px; }

  .card { background:#fff; border-radius:20px; overflow:hidden; box-shadow:0 2px 6px rgba(60,40,20,.06), 0 18px 40px rgba(120,70,30,.14); border:1px solid #f1ece2; }

  .item { display:flex; align-items:center; gap:14px; padding:15px 17px; border-bottom:1px solid #f1ece2; }
  .item:last-child { border-bottom:none; }
  .ic { width:36px; height:36px; border-radius:11px; background:var(--paper-2); display:flex; align-items:center; justify-content:center; flex:none; color:var(--ink-deep); }
  .ic.red { background:var(--pop-soft); color:var(--pop); }
  .it-mid { flex:1; min-width:0; }
  .it-mid h4 { font-size:15.5px; font-weight:700; color:var(--ink); letter-spacing:-.2px; }
  .it-mid .desc { font-size:11.5px; color:var(--mut-strong); margin-top:2px; }
  .it-val { font-size:13px; color:var(--mut-strong); font-weight:600; flex:none; }
  .chev { flex:none; color:#c9bda9; }

  /* switch */
  .sw { width:48px; height:29px; border-radius:30px; background:#e2dacd; flex:none; position:relative; transition:background .2s; }
  .sw::after { content:""; position:absolute; top:2.5px; left:2.5px; width:24px; height:24px; border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.2); transition:left .2s; }
  .sw.on { background:var(--pop); }
  .sw.on::after { left:21.5px; }

  .logout { margin-top:26px; }
  .logout .card { display:flex; align-items:center; justify-content:center; padding:16px; }
  .logout .card span { font-size:16px; font-weight:800; color:var(--pop); letter-spacing:.3px; }

  .ver { text-align:center; font-size:11.5px; color:var(--mut-strong); margin-top:18px; }
  .ver .vv { font-family:var(--serif); }

  .home-ind { position:absolute; bottom:9px; left:50%; transform:translateX(-50%); width:134px; height:5px; border-radius:3px; background:#2c241b; opacity:.85; z-index:55; }
  .item:active, .backbtn:active, .sw:active, .logout .card:active { transform:scale(.97); }
</style>
</head>
<body>
<div class="phone">
  <div class="notch"></div>
  <div class="status">
    <span>9:41</span>
    <span class="right">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="none"><rect x="0" y="7" width="3" height="5" rx="1" fill="#2c241b"/><rect x="5" y="4.5" width="3" height="7.5" rx="1" fill="#2c241b"/><rect x="10" y="2" width="3" height="10" rx="1" fill="#2c241b"/><rect x="15" y="0" width="3" height="12" rx="1" fill="#2c241b" opacity=".35"/></svg>
      <svg width="17" height="12" viewBox="0 0 17 12" fill="none"><path d="M8.5 2.5C11 2.5 13.2 3.5 14.8 5.1L8.5 11.4 2.2 5.1C3.8 3.5 6 2.5 8.5 2.5Z" fill="#2c241b"/></svg>
      <svg width="26" height="13" viewBox="0 0 26 13" fill="none"><rect x="1" y="1" width="21" height="11" rx="3" stroke="#2c241b" stroke-width="1.2" opacity=".5"/><rect x="3" y="3" width="16" height="7" rx="1.5" fill="#2c241b"/><rect x="23.5" y="4.5" width="2" height="4" rx="1" fill="#2c241b" opacity=".6"/></svg>
    </span>
  </div>

  <div class="scroll">
    <div class="nav">
      <div class="backbtn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fbf8f3" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></div>
      <div>
        <div class="eyebrow">随手调一调</div>
        <h1>设置</h1>
      </div>
    </div>

    <div class="body">
      <div class="group">
        <div class="gtitle">账号与安全</div>
        <div class="card">
          <div class="item">
            <div class="ic"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14M5 8a2 2 0 01-2-2V5a2 2 0 012-2h14a2 2 0 012 2v1a2 2 0 01-2 2M5 8v11a2 2 0 002 2h10a2 2 0 002-2V8"/></svg></div>
            <div class="it-mid"><h4>手机号</h4></div>
            <span class="it-val">138****6666</span>
            <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>
          </div>
          <div class="item">
            <div class="ic"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 018 0v3"/></svg></div>
            <div class="it-mid"><h4>修改密码</h4></div>
            <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>
          </div>
          <div class="item">
            <div class="ic"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a5 5 0 015 5c0 2-1 3.5-2.5 5L12 20l-2.5-8C8 10.5 7 9 7 7a5 5 0 015-5z"/></svg></div>
            <div class="it-mid"><h4>微信绑定</h4></div>
            <span class="it-val">已绑定</span>
            <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>
          </div>
        </div>
      </div>

      <div class="group">
        <div class="gtitle">消息提醒</div>
        <div class="card">
          <div class="item">
            <div class="ic"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 00-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 01-3.4 0"/></svg></div>
            <div class="it-mid"><h4>家庭动态提醒</h4><div class="desc">家人加菜、排菜时通知我</div></div>
            <div class="sw on"></div>
          </div>
          <div class="item">
            <div class="ic"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 01-8.5 8.5 8.4 8.4 0 01-3.8-.9L3 21l1.9-5.7A8.4 8.4 0 0112.5 3 8.4 8.4 0 0121 11.5z"/></svg></div>
            <div class="it-mid"><h4>社区互动提醒</h4><div class="desc">评论、点赞、收藏</div></div>
            <div class="sw on"></div>
          </div>
          <div class="item">
            <div class="ic"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l18-5v12L3 14v-3zM11.6 16.8A3 3 0 017 16"/></svg></div>
            <div class="it-mid"><h4>营销推送</h4></div>
            <div class="sw"></div>
          </div>
        </div>
      </div>

      <div class="group">
        <div class="gtitle">通用</div>
        <div class="card">
          <div class="item">
            <div class="ic"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M3 12h18M3 18h12"/></svg></div>
            <div class="it-mid"><h4>字体大小</h4></div>
            <span class="it-val">标准</span>
            <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>
          </div>
          <div class="item">
            <div class="ic"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6c0-1.7 4-3 9-3s9 1.3 9 3-4 3-9 3-9-1.3-9-3zM3 6v6c0 1.7 4 3 9 3s9-1.3 9-3V6M3 12v6c0 1.7 4 3 9 3s9-1.3 9-3v-6"/></svg></div>
            <div class="it-mid"><h4>清除缓存</h4></div>
            <span class="it-val">23.6 MB</span>
            <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>
          </div>
        </div>
      </div>

      <div class="group">
        <div class="gtitle">关于</div>
        <div class="card">
          <div class="item">
            <div class="ic"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/></svg></div>
            <div class="it-mid"><h4>用户协议</h4></div>
            <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>
          </div>
          <div class="item">
            <div class="ic"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l8 4v6c0 5-3.5 8-8 10-4.5-2-8-5-8-10V6z"/></svg></div>
            <div class="it-mid"><h4>隐私政策</h4></div>
            <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>
          </div>
          <div class="item">
            <div class="ic"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/></svg></div>
            <div class="it-mid"><h4>关于我们</h4></div>
            <span class="it-val">v1.0.0</span>
            <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>
          </div>
          <div class="item">
            <div class="ic"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg></div>
            <div class="it-mid"><h4>意见反馈</h4></div>
            <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>
          </div>
        </div>
      </div>

      <div class="logout"><div class="card"><span>退出登录</span></div></div>
      <div class="ver">家庭点菜 <span class="vv">v1.0.0</span> · © 2026</div>
    </div>
  </div>
  <div class="home-ind"></div>
</div>
</body>
</html>
