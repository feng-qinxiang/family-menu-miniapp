<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>家庭点菜 · 启动</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-font-smoothing:antialiased; }
  :root{
    --paper:#fbf8f3; --paper-2:#f0ebe2;
    --ink:#2c241b; --ink-deep:#3a2e23;
    --mut:#9a8e7d; --mut-strong:#7a6e5d;
    --gold:#f4d9a8; --gold-deep:#b08949;
    --pop:#e8472a;
    --serif:"Georgia","Times New Roman",serif;
  }
  body {
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; background:#d9d2c7;
    font-family:-apple-system,"SF Pro Text","Helvetica Neue",Helvetica,Arial,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  }
  .phone {
    position:relative; width:390px; height:844px;
    background:var(--paper); border-radius:46px;
    box-shadow:0 30px 70px rgba(60,45,30,.4), 0 0 0 11px #1b1714, 0 0 0 12px #2c2520;
    overflow:hidden;
  }
  .notch { position:absolute; top:11px; left:50%; transform:translateX(-50%); width:118px; height:33px; background:#1b1714; border-radius:20px; z-index:61; }
  .status {
    position:absolute; top:0; left:0; right:0; height:50px; z-index:60;
    display:flex; align-items:center; justify-content:space-between;
    padding:0 30px 0 34px; color:var(--ink-deep); font-size:15px; font-weight:600; pointer-events:none;
  }
  .status .right { display:flex; align-items:center; gap:7px; }

  /* subtle warm bloom */
  .stage { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .stage::before { content:""; position:absolute; top:34%; left:50%; transform:translate(-50%,-50%); width:460px; height:460px; border-radius:50%;
    background:radial-gradient(circle, rgba(176,137,73,.14), transparent 62%); pointer-events:none; }
  .stage::after { content:""; position:absolute; top:34%; left:50%; transform:translate(-50%,-50%); width:300px; height:300px; border-radius:50%;
    border:1px solid rgba(176,137,73,.18); pointer-events:none; }

  .brand-eyebrow { position:relative; font-family:var(--serif); font-style:italic; font-size:13px; letter-spacing:1.5px; color:var(--gold-deep); font-weight:700; margin-bottom:30px; }

  .logo { position:relative; width:108px; height:108px; }
  .logo .ring { position:absolute; inset:0; border-radius:50%; background:linear-gradient(135deg,#fff,#f3ece0); box-shadow:0 2px 6px rgba(60,40,20,.06), 0 18px 40px rgba(120,70,30,.14); border:1px solid #efe7da; }

  .app-name {
    position:relative; margin-top:34px;
    font-size:50px; font-weight:900; letter-spacing:-2px; color:var(--ink);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif; line-height:1;
  }
  .app-name .pop { color:var(--pop); }
  .slogan { position:relative; margin-top:16px; font-family:var(--serif); font-style:italic; font-size:16px; letter-spacing:1.2px; color:var(--mut-strong); font-weight:400; }
  .rule { position:relative; margin-top:22px; width:46px; height:3px; border-radius:3px; background:var(--pop); }

  .footer { position:absolute; bottom:60px; left:0; right:0; text-align:center; }
  .footer .tagline { font-size:13.5px; color:var(--mut-strong); letter-spacing:2px; font-weight:600; }
  .footer .ver { font-size:11px; color:var(--mut); letter-spacing:1px; margin-top:9px; font-family:var(--serif); }

  .home-ind { position:absolute; bottom:9px; left:50%; transform:translateX(-50%); width:134px; height:5px; border-radius:3px; background:#2c241b; opacity:.85; z-index:55; }
</style>
</head>
<body>
<div class="phone">
  <div class="notch"></div>
  <div class="status">
    <span>9:41</span>
    <span class="right">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="none"><rect x="0" y="7" width="3" height="5" rx="1" fill="#3a2e23"/><rect x="5" y="4.5" width="3" height="7.5" rx="1" fill="#3a2e23"/><rect x="10" y="2" width="3" height="10" rx="1" fill="#3a2e23"/><rect x="15" y="0" width="3" height="12" rx="1" fill="#3a2e23" opacity=".4"/></svg>
      <svg width="17" height="12" viewBox="0 0 17 12" fill="none"><path d="M8.5 2.5C11 2.5 13.2 3.5 14.8 5.1L8.5 11.4 2.2 5.1C3.8 3.5 6 2.5 8.5 2.5Z" fill="#3a2e23"/></svg>
      <svg width="26" height="13" viewBox="0 0 26 13" fill="none"><rect x="1" y="1" width="21" height="11" rx="3" stroke="#3a2e23" stroke-width="1.2" opacity=".5"/><rect x="3" y="3" width="16" height="7" rx="1.5" fill="#3a2e23"/><rect x="23.5" y="4.5" width="2" height="4" rx="1" fill="#3a2e23" opacity=".6"/></svg>
    </span>
  </div>

  <div class="stage">
    <div class="brand-eyebrow">FAMILY KITCHEN · EST. 2026</div>

    <div class="logo">
      <div class="ring"></div>
      <svg width="108" height="108" viewBox="0 0 108 108" fill="none">
        <defs>
          <linearGradient id="foil" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#d4a857"/>
            <stop offset="0.5" stop-color="#f3d796"/>
            <stop offset="1" stop-color="#b8863a"/>
          </linearGradient>
        </defs>
        <!-- chopsticks -->
        <line x1="62" y1="30" x2="78" y2="58" stroke="url(#foil)" stroke-width="3.4" stroke-linecap="round"/>
        <line x1="69" y1="28" x2="83" y2="57" stroke="url(#foil)" stroke-width="3.4" stroke-linecap="round"/>
        <!-- bowl -->
        <path d="M28 52 H80 A26 26 0 0 1 28 52 Z" fill="url(#foil)"/>
        <path d="M28 52 H80 A26 26 0 0 1 28 52 Z" stroke="#a87d35" stroke-width="1.2" stroke-linejoin="round"/>
        <!-- bowl base -->
        <path d="M44 78 H64 L60 70 H48 Z" fill="url(#foil)"/>
        <!-- steam -->
        <path d="M44 42 q-4 -7 0 -13 q4 -6 0 -12" stroke="#c9a35a" stroke-width="2.4" stroke-linecap="round" fill="none" opacity=".75"/>
        <path d="M56 42 q4 -7 0 -13 q-4 -6 0 -12" stroke="#c9a35a" stroke-width="2.4" stroke-linecap="round" fill="none" opacity=".55"/>
      </svg>
    </div>

    <div class="app-name">家庭<span class="pop">点菜</span></div>
    <div class="slogan">Today's Family Menu</div>
    <div class="rule"></div>
  </div>

  <div class="footer">
    <div class="tagline">为一家人的餐桌</div>
    <div class="ver">Version 1.0.0</div>
  </div>

  <div class="home-ind"></div>
</div>
</body>
</html>
