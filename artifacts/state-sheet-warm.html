<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>家庭点菜 · 操作面板</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-font-smoothing:antialiased; }
  :root{
    --paper:#fbf8f3; --paper-2:#f0ebe2;
    --ink:#2c241b; --ink-deep:#3a2e23;
    --mut:#9a8e7d; --mut-2:#b3a795; --mut-strong:#7a6e5d;
    --gold:#f4d9a8; --gold-deep:#b08949;
    --pop:#e8472a; --pop-soft:#fdece6;
    --pine:#2f4a3a;
    --serif:"Georgia","Times New Roman",serif;
  }
  body {
    display:flex; align-items:center; justify-content:center; flex-wrap:wrap; gap:40px;
    min-height:100vh; background:#d9d2c7; padding:40px 0;
    font-family:-apple-system,"SF Pro Text","Helvetica Neue",Helvetica,Arial,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  }
  .phone {
    position:relative; width:390px; height:844px;
    background:var(--paper); border-radius:46px;
    box-shadow:0 30px 70px rgba(60,45,30,.4), 0 0 0 11px #1b1714, 0 0 0 12px #2c2520;
    overflow:hidden;
  }
  .status {
    position:absolute; top:0; left:0; right:0; height:50px; z-index:60;
    display:flex; align-items:center; justify-content:space-between;
    padding:0 30px 0 34px; color:#fff; font-size:15px; font-weight:600; pointer-events:none;
  }
  .status .right { display:flex; align-items:center; gap:7px; }
  .notch { position:absolute; top:11px; left:50%; transform:translateX(-50%); width:118px; height:33px; background:#1b1714; border-radius:20px; z-index:61; }

  /* dimmed background (simplified home) */
  .bg { position:absolute; inset:0; z-index:1; }
  .bg-hero { height:420px; background:url('img/mapo-tofu.jpg') center/cover no-repeat; position:relative; }
  .bg-hero::after { content:""; position:absolute; inset:0; background:linear-gradient(180deg, rgba(20,14,8,.45) 0%, rgba(20,14,8,.15) 40%, rgba(20,14,8,.6) 100%); }
  .bg-top { position:absolute; top:58px; left:24px; right:24px; z-index:5; display:flex; align-items:center; justify-content:space-between; color:#fff; }
  .bg-top .hi { font-size:12px; letter-spacing:2.5px; text-transform:uppercase; opacity:.85; font-weight:700; }
  .bg-top .name { font-size:17px; font-weight:600; margin-top:3px; }
  .bg-icon { width:42px; height:42px; border-radius:50%; background:rgba(255,255,255,.16); display:flex; align-items:center; justify-content:center; border:1px solid rgba(255,255,255,.22); }
  .bg-title { position:absolute; left:24px; bottom:34px; z-index:5; color:#fff; }
  .bg-title .tg { display:inline-block; font-family:var(--serif); font-style:italic; font-size:12px; letter-spacing:1.5px; font-weight:700; color:#fff; background:var(--pop); padding:6px 14px; border-radius:4px; }
  .bg-title h1 { font-size:60px; line-height:.9; font-weight:900; letter-spacing:-3px; margin-top:14px; font-family:"PingFang SC","Microsoft YaHei",sans-serif; color:transparent; -webkit-text-stroke:1.5px #fff; }
  .bg-sheet { background:var(--paper); border-radius:28px 28px 0 0; margin-top:-26px; position:relative; padding:26px 24px; }
  .bg-card { background:#fff; border-radius:22px; height:120px; box-shadow:0 18px 40px rgba(120,70,30,.1); margin-bottom:16px; }
  .bg-card2 { background:var(--ink-deep); border-radius:24px; height:150px; }

  /* overlay scrim */
  .scrim { position:absolute; inset:0; z-index:30; background:rgba(20,14,8,.45); backdrop-filter:blur(2px); }

  /* action sheet */
  .sheet { position:absolute; left:0; right:0; bottom:0; z-index:40;
    background:var(--paper); border-radius:28px 28px 0 0; padding:10px 16px 14px;
    box-shadow:0 -20px 50px rgba(20,14,8,.3); }
  .grip { width:42px; height:5px; border-radius:3px; background:#dcd3c5; margin:6px auto 14px; }

  /* recipe header inside sheet */
  .sh-head { display:flex; align-items:center; gap:14px; padding:4px 8px 16px; border-bottom:1px solid #ece5d9; margin-bottom:10px; }
  .sh-thumb { width:56px; height:56px; border-radius:16px; background:url('img/mapo-tofu.jpg') center/cover; flex:none; box-shadow:0 6px 14px rgba(120,70,30,.2); }
  .sh-meta { flex:1; min-width:0; }
  .sh-meta .eyebrow { font-family:var(--serif); font-style:italic; font-size:11px; letter-spacing:.5px; color:var(--gold-deep); font-weight:700; }
  .sh-meta h3 { font-size:19px; font-weight:900; color:var(--ink); letter-spacing:-.5px; margin-top:2px; }
  .sh-meta .sub { font-size:12px; color:var(--mut-strong); margin-top:3px; }

  /* action rows */
  .act { display:flex; align-items:center; gap:16px; padding:15px 10px; border-radius:16px; min-height:44px; }
  .act:active { background:var(--paper-2); }
  .act .ic { width:42px; height:42px; border-radius:13px; background:var(--paper-2); display:flex; align-items:center; justify-content:center; flex:none; color:var(--ink-deep); }
  .act .tx { flex:1; }
  .act .tx .t { font-size:16px; font-weight:700; color:var(--ink); letter-spacing:-.2px; }
  .act .tx .d { font-size:12px; color:var(--mut); margin-top:2px; }
  .act .arr { color:var(--mut-2); flex:none; }
  .act.danger .ic { background:var(--pop-soft); color:var(--pop); }
  .act.danger .tx .t { color:var(--pop); }
  .act-sep { height:1px; background:#ece5d9; margin:6px 12px; }

  .cancel { margin-top:10px; text-align:center; font-size:16px; font-weight:800; color:var(--ink-deep);
    padding:16px; border-radius:18px; background:#fff; box-shadow:0 2px 6px rgba(60,40,20,.06); border:1px solid #f1ece2; }
  .cancel:active { background:var(--paper-2); }
  .home-ind { position:absolute; bottom:9px; left:50%; transform:translateX(-50%); width:134px; height:5px; border-radius:3px; background:#2c241b; opacity:.3; z-index:45; }

  /* ===== share sheet variant ===== */
  .sh-title { text-align:center; padding:2px 0 16px; }
  .sh-title .eyebrow { font-family:var(--serif); font-style:italic; font-size:11px; letter-spacing:1px; color:var(--gold-deep); font-weight:700; }
  .sh-title h3 { font-size:20px; font-weight:900; color:var(--ink); letter-spacing:-.5px; margin-top:4px; }
  .share-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:12px 6px; padding:6px 6px 18px; border-bottom:1px solid #ece5d9; margin-bottom:10px; }
  .sg { display:flex; flex-direction:column; align-items:center; gap:9px; }
  .sg .circ { width:56px; height:56px; border-radius:18px; display:flex; align-items:center; justify-content:center; color:#fff; box-shadow:0 8px 18px rgba(60,40,20,.16); }
  .sg .lbl { font-size:11.5px; font-weight:600; color:var(--mut-strong); }
  .sg .wx { background:#3eb544; }
  .sg .pyq { background:#5ec85f; }
  .sg .lnk { background:var(--ink-deep); }
  .sg .pic { background:var(--gold-deep); }
  .label-ph { position:absolute; top:14px; left:0; right:0; text-align:center; z-index:70; color:#5a4d3c; font-size:12px; font-weight:800; letter-spacing:2px; text-transform:uppercase; pointer-events:none; }
</style>
</head>
<body>

<!-- ============ 主面板:菜谱「更多操作」 ============ -->
<div class="phone">
  <div class="label-ph">更多操作</div>
  <div class="notch"></div>
  <div class="status">
    <span>9:41</span>
    <span class="right">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="none"><rect x="0" y="7" width="3" height="5" rx="1" fill="#fff"/><rect x="5" y="4.5" width="3" height="7.5" rx="1" fill="#fff"/><rect x="10" y="2" width="3" height="10" rx="1" fill="#fff"/><rect x="15" y="0" width="3" height="12" rx="1" fill="#fff" opacity=".4"/></svg>
      <svg width="17" height="12" viewBox="0 0 17 12" fill="none"><path d="M8.5 2.5C11 2.5 13.2 3.5 14.8 5.1L8.5 11.4 2.2 5.1C3.8 3.5 6 2.5 8.5 2.5Z" fill="#fff"/></svg>
      <svg width="26" height="13" viewBox="0 0 26 13" fill="none"><rect x="1" y="1" width="21" height="11" rx="3" stroke="#fff" stroke-width="1.2" opacity=".5"/><rect x="3" y="3" width="16" height="7" rx="1.5" fill="#fff"/><rect x="23.5" y="4.5" width="2" height="4" rx="1" fill="#fff" opacity=".6"/></svg>
    </span>
  </div>

  <!-- dimmed background -->
  <div class="bg">
    <div class="bg-hero">
      <div class="bg-top">
        <div><div class="hi">晚上好</div><div class="name">小张，今晚想吃点啥</div></div>
        <div class="bg-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/></svg></div>
      </div>
      <div class="bg-title"><span class="tg">今天这一桌</span><h1>麻婆豆腐</h1></div>
    </div>
    <div class="bg-sheet">
      <div class="bg-card"></div>
      <div class="bg-card2"></div>
    </div>
  </div>

  <div class="scrim"></div>

  <div class="sheet">
    <div class="grip"></div>
    <div class="sh-head">
      <div class="sh-thumb"></div>
      <div class="sh-meta">
        <div class="eyebrow">这道菜</div>
        <h3>麻婆豆腐</h3>
        <div class="sh-meta-sub sub">川菜 · 麻辣 · 做过 3 次</div>
      </div>
    </div>

    <div class="act">
      <div class="ic"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg></div>
      <div class="tx"><div class="t">分享给家人</div><div class="d">发到家庭群，一起点菜</div></div>
      <div class="arr"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg></div>
    </div>
    <div class="act">
      <div class="ic"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-9.5A3.8 3.8 0 0112 8a3.8 3.8 0 017 2.5C19 15.6 12 20 12 20z"/></svg></div>
      <div class="tx"><div class="t">收藏菜谱</div><div class="d">加入我的常做收藏</div></div>
      <div class="arr"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg></div>
    </div>
    <div class="act">
      <div class="ic"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg></div>
      <div class="tx"><div class="t">编辑菜谱</div><div class="d">改食材、步骤或时间</div></div>
      <div class="arr"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg></div>
    </div>

    <div class="act-sep"></div>

    <div class="act danger">
      <div class="ic"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V5a2 2 0 012-2h2a2 2 0 012 2v2M6 7l1 13a2 2 0 002 2h6a2 2 0 002-2l1-13"/></svg></div>
      <div class="tx"><div class="t">删除菜谱</div><div class="d">从我的菜谱中移除</div></div>
    </div>

    <div class="cancel">取消</div>
  </div>
  <div class="home-ind"></div>
</div>

<!-- ============ 变体:分享面板 ============ -->
<div class="phone">
  <div class="label-ph">分享面板</div>
  <div class="notch"></div>
  <div class="status">
    <span>9:41</span>
    <span class="right">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="none"><rect x="0" y="7" width="3" height="5" rx="1" fill="#fff"/><rect x="5" y="4.5" width="3" height="7.5" rx="1" fill="#fff"/><rect x="10" y="2" width="3" height="10" rx="1" fill="#fff"/><rect x="15" y="0" width="3" height="12" rx="1" fill="#fff" opacity=".4"/></svg>
      <svg width="17" height="12" viewBox="0 0 17 12" fill="none"><path d="M8.5 2.5C11 2.5 13.2 3.5 14.8 5.1L8.5 11.4 2.2 5.1C3.8 3.5 6 2.5 8.5 2.5Z" fill="#fff"/></svg>
      <svg width="26" height="13" viewBox="0 0 26 13" fill="none"><rect x="1" y="1" width="21" height="11" rx="3" stroke="#fff" stroke-width="1.2" opacity=".5"/><rect x="3" y="3" width="16" height="7" rx="1.5" fill="#fff"/><rect x="23.5" y="4.5" width="2" height="4" rx="1" fill="#fff" opacity=".6"/></svg>
    </span>
  </div>

  <div class="bg">
    <div class="bg-hero">
      <div class="bg-top">
        <div><div class="hi">晚上好</div><div class="name">小张，今晚想吃点啥</div></div>
        <div class="bg-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/></svg></div>
      </div>
      <div class="bg-title"><span class="tg">今天这一桌</span><h1>麻婆豆腐</h1></div>
    </div>
    <div class="bg-sheet">
      <div class="bg-card"></div>
      <div class="bg-card2"></div>
    </div>
  </div>

  <div class="scrim"></div>

  <div class="sheet">
    <div class="grip"></div>
    <div class="sh-title">
      <div class="eyebrow">分享到</div>
      <h3>把这道菜分享出去</h3>
    </div>
    <div class="share-grid">
      <div class="sg">
        <div class="circ wx"><svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M9.2 4C5 4 1.7 6.8 1.7 10.2c0 2 1.2 3.7 3 4.9l-.6 2 2.3-1.2c.9.2 1.6.3 2.4.3h.5a4.9 4.9 0 01-.2-1.4c0-3.2 3.1-5.6 6.8-5.6h.4C16 6 12.9 4 9.2 4zm-2.7 3.4a.95.95 0 110 1.9.95.95 0 010-1.9zm5.3 0a.95.95 0 110 1.9.95.95 0 010-1.9z"/><path d="M22.3 14.6c0-2.8-2.7-5-6-5s-6 2.2-6 5 2.7 5 6 5c.7 0 1.4-.1 2-.3l1.9 1-.5-1.7c1.6-.9 2.6-2.4 2.6-4zm-8-1.3a.8.8 0 110 1.6.8.8 0 010-1.6zm4 0a.8.8 0 110 1.6.8.8 0 010-1.6z"/></svg></div>
        <div class="lbl">微信好友</div>
      </div>
      <div class="sg">
        <div class="circ pyq"><svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="3.4" fill="#fff" stroke="none"/></svg></div>
        <div class="lbl">朋友圈</div>
      </div>
      <div class="sg">
        <div class="circ lnk"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 007.5.5l3-3a5 5 0 00-7-7l-1.5 1.5"/><path d="M14 11a5 5 0 00-7.5-.5l-3 3a5 5 0 007 7L12 19"/></svg></div>
        <div class="lbl">复制链接</div>
      </div>
      <div class="sg">
        <div class="circ pic"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="8.5" cy="9.5" r="1.6"/><path d="M21 16l-5-5L5 20"/></svg></div>
        <div class="lbl">保存图片</div>
      </div>
    </div>

    <div class="act">
      <div class="ic"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h11a2 2 0 012 2v14l-7-3-6 3V4z"/></svg></div>
      <div class="tx"><div class="t">添加到今日菜单</div><div class="d">分享前先加进今晚的菜单</div></div>
      <div class="arr"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg></div>
    </div>

    <div class="cancel">取消</div>
  </div>
  <div class="home-ind"></div>
</div>

</body>
</html>
